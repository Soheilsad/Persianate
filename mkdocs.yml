site_name: The Persianate World — Wiki
site_description: Player wiki for The Persianate World, a mod for Europa Universalis V.
site_url: https://iranshahr.lat

docs_dir: wiki
site_dir: site

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - navigation.indexes
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Home: index.md
  - Getting started:
      - Starting the game: concepts/starting-the-game.md
      - What changed in 1.4: whats-new-in-1-4.md
      - Known issues and testing: reference/known-issues.md
  - The Persianate state:
      - Overview of concepts: concepts/index.md
      - The Persianate Sultanate: concepts/persianate-sultanate.md
      - Government reforms: concepts/government-reforms.md
      - Türk vs Tāzīk: concepts/turk-vs-tazik.md
      - The Dīwān estate: concepts/diwan-estate.md
      - The Amirs estate: concepts/amirs-estate.md
      - Estate privileges: concepts/estate-privileges.md
      - The Maẓālim court: concepts/mazalim-court.md
      - Buildings, goods and materials: concepts/buildings.md
      - The military system: concepts/military-system.md
      - Demography and cultures: concepts/demography-and-cultures.md
  - The succession of Erānzamīn:
      - The Succession of Erānzamīn: concepts/eranzamin-situation.md
      - The Erānzamīn organisation: concepts/eranzamin-organisation.md
      - The Borrowed Mandate: concepts/borrowed-mandate.md
      - The Ilkhanate Governorate: concepts/ilkhanate-governorate.md
      - The Farr Under Examination: concepts/farr-proof-of-fortune.md
      - The Burden of the Sword: concepts/ghazi-burden-of-sword.md
      - The Matter of Tork: concepts/matter-of-tork.md
  - The Shia world:
