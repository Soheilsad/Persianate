 persianate_debug_bgl_begin.title: "DEBUG: Begin the Beglerbeg's Regency"
 persianate_debug_bgl_begin.desc: "TEST TOOL. Starts the Beglerbeg's Regency on this horde as if a beg had just won the succession (our ruler stays whoever he is)."
 persianate_debug_bgl_begin.a: "Begin."
 persianate_debug_bgl_advance.title: "DEBUG: Beglerbeg's Regency, Next Stage"
 persianate_debug_bgl_advance.desc: "TEST TOOL. +100 progress; the stage turns at the next month."
 persianate_debug_bgl_advance.a: "Advance."
 persianate_debug_bgl_fill_gap.title: "DEBUG: Beglerbeg's Regency, Fill the Gap"
 persianate_debug_bgl_fill_gap.desc: "TEST TOOL. Gap to 100 and five years of filled months: in stage 4 with a khān in keeping, The House Holds follows next month."
 persianate_debug_bgl_fill_gap.a: "Fill."
 persianate_debug_bgl_empty_gap.title: "DEBUG: Beglerbeg's Regency, Empty the Gap"
 persianate_debug_bgl_empty_gap.desc: "TEST TOOL. Gap to 0 and three years of empty months: the Partition follows next month."
 persianate_debug_bgl_empty_gap.a: "Empty."
 persianate_debug_bgl_prince.title: "DEBUG: A Prince Declares Himself Khān"
 persianate_debug_bgl_prince.desc: "TEST TOOL. The strongest prince with a share breaks with us and claims the throne."
 persianate_debug_bgl_prince.a: "Let him."
