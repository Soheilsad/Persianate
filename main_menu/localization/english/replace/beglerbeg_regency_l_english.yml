l_english:
 # The Beglerbeg's Regency (the Golden Horde's regency)
 beglerbegs_regency: "The Beglerbeg's Regency"
 beglerbegs_regency_desc: "A beg rules the khanate through a khān he keeps. The begs and the princes follow him while he delivers, and no longer. A prince of the line may break him, his house may make the office its own, or the khanate may come apart into its shares."
 beglerbegs_regency_end_tt: "Ends when a khān of the line rules again, when the office becomes the house's own, or when the khanate is partitioned."
 BGL_STAGE_1: "I. The Beglerbeg's Peace"
 BGL_STAGE_1_TT: "One beg rules through a khān and the princes are quiet. Next: #Y The Princes Stir#!, when a prince with a share may declare himself khān."
 BGL_STAGE_2: "II. The Princes Stir"
 BGL_STAGE_2_TT: "Each year a prince with a share may break with the regent and claim the throne by war. Next: #Y The Shock from Outside#!."
 BGL_STAGE_3: "III. The Shock from Outside"
 BGL_STAGE_3_TT: "Strong neighbours hold a claim on the khanate for ten years, and shares break away under their princes. Next: the last stage, where the endings are counted."
 BGL_STAGE_4: "IV. The Office or the Shares"
 BGL_STAGE_4_TT: "With a khān in keeping and the legitimacy gap filled for five years running, the office becomes the regent's house's own. If the clock fills with the gap under the line, the khanate is partitioned."
 BGL_REGENCY_PANEL_POINTER: "The regent's actions are below: #Y Distribute Largesse#!, #Y Marry into the Line#! and #Y Recall the Darughas#!. A landless prince can be bought off with a share (the character action #Y Grant a Share#!), at the price of giving him a base."
 bgl_distribute_largesse: "Distribute Largesse"
 bgl_distribute_largesse_desc: "Open the treasury to the begs and the princes: robes, horses and silver. A year's income fills part of the legitimacy gap and buys two years of quiet."
 bgl_largesse_tt: "The legitimacy gap gains #G 10#!. The nobles gain #G 5%#! satisfaction. For two years a prince with a share is a quarter as likely to declare himself khān."
 bgl_marry_into_the_line: "Marry into the Line"
 bgl_marry_into_the_line_desc: "Take a wife of Chinggis's house. A beg cannot be khān, but he can be a khān's son-in-law, and men who would not obey a commander will hear a güregen."
 bgl_marriage_tt: "The legitimacy gap gains #G 5#! and drains a quarter slower while this ruler lives."
 bgl_recall_darughas: "Recall the Darughas"
 bgl_recall_darughas_desc: "Call in the appointed begs from their districts. This acts only inside our own realm: the nobles' estate is weakened for ten years and the regency's clock runs back, and they will not forgive it."
 opinion_bgl_a_beg_on_the_felt: "A beg rules in the khān's place"
 STATIC_MODIFIER_NAME_bgl_house_holds_mod: "The Office Is the House's"
 STATIC_MODIFIER_DESC_bgl_house_holds_mod: "The keeping of the khān has passed into this house as an inheritance."
 STATIC_MODIFIER_NAME_bgl_partitioned_mod: "The Khanate Partitioned"
 STATIC_MODIFIER_DESC_bgl_partitioned_mod: "The shares have gone their own way under their princes."
 beglerbeg_regency.1.title: "The Beglerbeg"
 beglerbeg_regency.1.desc: "The quriltai did not raise a prince. It raised the man who commands the army, because the army was there and the princes were not agreed. He has not taken the title, and he will not: a khān must be of Chinggis's house, and everyone in the camp knows whose son the commander is. So a prince of the line has been found and set on the white felt, the coins will carry that prince's name, and the orders will carry the commander's seal."
 beglerbeg_regency.1.a: "The khān reigns. We shall see to the rest."
 beglerbeg_regency_begins_tt: "#Y The Beglerbeg's Regency#! has begun. Our standing among the begs and the princes is the #Y legitimacy gap#! on the disaster's panel: it drains every month and is filled by battles and sieges won, wars won and largesse.\nFrom the second stage a prince with a share may declare himself khān. A grown khān with a soldier's skill may try to rule."
 beglerbeg_regency.2.title: "Another Khān"
 beglerbeg_regency.2.desc: "The khān is dead, and for a month the orders went out in no one's name. Another prince of the line has been brought to the camp and raised. The begs came to the ceremony. Fewer of them knelt as low as last time."
 beglerbeg_regency.2.a: "A khān is a khān."
 beglerbeg_regency.3.title: "The Beglerbeg's Heir"
 beglerbeg_regency.3.desc: "The beglerbeg is dead and his heir sits in his place, with the same khān in the same tent. What the father had earned in twenty years of campaigns was his own and has gone into the ground with him. The son has the office and the khān, and has still to show the begs why he should keep either."
 beglerbeg_regency.3.a: "He will have to earn it again."
 beglerbeg_regency_heir_tt: "The regency continues under the new ruler. The legitimacy gap loses #R 15#!, the clock moves #R 20#! toward the next stage, and a wife of the line must be found again."
 beglerbeg_regency.10.title: "The Princes Stir"
 beglerbeg_regency.10.desc: "The princes who hold shares of the khanate have begun to write to one another. None of them questions the khān. All of them ask, in one form of words or another, why a man who is not of the house gives orders to men who are."
 beglerbeg_regency.10.a: "Watch the one with the most riders."
 beglerbeg_regency_stage_2_tt: "#Y The Princes Stir.#! Every prince with a share thinks the worse of us (#R -60#! opinion). Each year the strongest of them may break with us and claim the throne by war: likelier in the later stages and when the legitimacy gap is under 30, and much less likely for two years after largesse."
 beglerbeg_regency.11.title: "The Shock from Outside"
 beglerbeg_regency.11.desc: "The khanate's neighbours have understood what the princes understood two years ago. Envoys who used to bring gifts now bring lists of grievances. On the far pastures, princes have stopped sending their sons to the camp."
 beglerbeg_regency.11.a: "Then we hold what we can reach."
 beglerbeg_regency_stage_3_tt: "#Y The Shock from Outside.#! Every strong neighbour holds a claim on the khanate for ten years. Each prince with a share has an even chance of breaking away as a khān of his own."
 beglerbeg_regency.12.title: "The Office or the Shares"
 beglerbeg_regency.12.desc: "It has gone on long enough that men have stopped saying it cannot last. They say now that it will end one of two ways: the beglerbeg's son will be beglerbeg after him, or there will be four khanates where there was one."
 beglerbeg_regency.12.a: "It will be the first."
 beglerbeg_regency_stage_4_tt: "#Y The last stage.#! With a khān in keeping and the legitimacy gap at 60 or more for five years running, the office becomes our house's own. If the clock fills with the gap under 60, or the gap stays empty for three years, the khanate is partitioned."
 beglerbeg_regency.15.title: "A Prince Declares Himself Khān"
 beglerbeg_regency.15.desc: "[SCOPE.sCountry('bgl_claimant').GetName] has sent back our seal. Its prince has had himself raised on the felt by his own begs and has written to every camp in the khanate: there is a khān of the line who needs no keeper, and the keeper should come and explain himself."
 beglerbeg_regency.15.a: "He can explain himself to our army."
 beglerbeg_regency.16.title: "The Felt Is Ours to Take"
 beglerbeg_regency.16.desc: "The begs of our own share have raised us. The man who rules at the great camp is not of the house; the prince he keeps is a boy who was not asked. We are of the house, we are grown, and we have riders. There will not be a better year than this one."
 beglerbeg_regency.16.a: "To the great camp."
 beglerbeg_regency_claim_tt: "We are no longer the regent's subject and hold a claim on his realm. If we beat him in war, we rule the whole khanate as its khān and our share is joined to it."
 beglerbeg_regency.20.title: "The Office Is the House's"
 beglerbeg_regency.20.desc: "Nobody alive in the camp has known another arrangement. The khān is raised, the beglerbeg rules, and when the beglerbeg dies his son will rule. It was a seizure once. It is a custom now, and customs do not need defending."
 beglerbeg_regency.20.a: "Let it be written down as custom."
 beglerbeg_regency_house_holds_tt: "#Y The House Holds.#! The disaster ends. We keep the khān and the reform, and gain #G 20#! horde unity and #G 15#! prestige. At our ruler's death his heir begins the regency again, with the legitimacy gap already at 60."
 beglerbeg_regency.30.title: "The Shares Go Their Own Way"
 beglerbeg_regency.30.desc: "The princes did not march on the great camp. They simply stopped answering it. Each has had himself raised by his own begs and strikes coin in his own name, and each can say, truthfully, that he is of the house and the man at the great camp is not."
 beglerbeg_regency.30.a: "We keep what we hold."
 beglerbeg_regency_partition_tt: "#Y The Partition.#! Every share becomes an independent khanate under its prince. We keep what we hold directly, with no khān and no office, and lose #R 30#! horde unity and #R 25#! prestige."
 beglerbeg_regency.40.title: "The Khān Rules"
 beglerbeg_regency.40.desc: "The khān was meant to hunt, sign and be seen. He spent the winter learning which begs the beglerbeg had passed over. When the camp moved in spring, the beglerbeg's guard was changed in the night by men who took their orders from the tent he had thought empty."
 beglerbeg_regency.40.a: "The house of Chinggis has remembered itself."
 beglerbeg_regency_purge_won_tt: "#Y The Khān Triumphant.#! The kept khān takes the throne and the beglerbeg is put to death. The regency and its reform end."
 beglerbeg_regency.41.title: "The Khān's Friends"
 beglerbeg_regency.41.desc: "The khān had been writing to the princes. One of the letters was carried to the wrong tent. The beglerbeg has the names now, and the khān knows that he has them."
 beglerbeg_regency.41.a: "A khān who plots is a khān too many."
 beglerbeg_regency_purge_failed_tt: "The khān tried to rule and failed. The clock moves #R 25#! toward the next stage. Three times in four he is put to death, and another must be raised."
 beglerbeg_regency.42.title: "A Khān of the Line"
 beglerbeg_regency.42.desc: "The prince who claimed the throne has taken the great camp. The beglerbeg is dead, the boy he kept has been sent to a quiet pasture, and the khanate and the prince's own share are one realm again under a man who needs no one's seal but his own."
 beglerbeg_regency.42.a: "The line rules."
 beglerbeg_regency.43.title: "The Line Returns"
 beglerbeg_regency.43.desc: "The beglerbeg is dead, and this time the quriltai raised a prince and gave him the army too. Nobody fought over it. The begs who had served the old arrangement knelt to the new one before the felt was cold."
 beglerbeg_regency.43.a: "A khān who rules."
 BGL_STAGE_PROGRESS: "Toward the next stage"
