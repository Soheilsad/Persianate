l_english:
 # ============================================================
 # 1. The Poet's Patron — Hafez of Shiraz
 # ============================================================
 eranzamin_flavor.1.title:0 "A Ghazal-Master in Shiraz"
 eranzamin_flavor.1.desc:0 "A man named Hafiz — Shams al-Din Muhammad, called Hafez for his memorization of the Qur'an — has gathered a circle of admirers in the Shirazi madrasas. His ghazals are passed hand-to-hand: wine, the rose, the absent Beloved, the hypocrisy of the pious. The poet asks for nothing, but his patrons say the meanings are deeper than the words. He will not leave Shiraz, even for Baghdad or Bengal. He is in our city now. What do we do with him?"
 eranzamin_flavor.1.a:0 "Lavish patronage — let his Diwan be the jewel of our court."
 eranzamin_flavor.1.b:0 "A modest stipend. The court need not be a singing-house."
 eranzamin_flavor.1.c:0 "His verse mocks the pious. Send him away."

 # ============================================================
 # 2. The Mustawfi's Register
 # ============================================================
 eranzamin_flavor.2.title:0 "The Nuzhat al-Qulūb"
 eranzamin_flavor.2.desc:0 "Hamdullah Mustawfi of Qazwin, who served Rashid al-Din and his son Ghiyath al-Din, has compiled a register: every province, every town, every river, every tax base from Khwarazm to the Mediterranean. He calls it the Nuzhat al-Qulūb — 'The Pleasure of Hearts.' The diwan wants it. The amirs see in it the death of the iqta. What say we?"
 eranzamin_flavor.2.a:0 "Adopt it. Every kharaj in the realm shall be assessed by this book."
 eranzamin_flavor.2.b:0 "Reward the man. Then shelve the book — let no copies be made."
 eranzamin_flavor.2.c:0 "Excellent — we now know which lands to grant out as iqta!"

 # ============================================================
 # 3. The Dilshad Question (Jalayirid only)
 # ============================================================
 eranzamin_flavor.3.title:0 "Dilshad Khatun"
 eranzamin_flavor.3.desc:0 "She was Abu Sa'id's queen. Now she is at our court, and the divan-secretaries report to her before they report to us. She speaks for the Mongol noyans and for the Persian scribes alike — perhaps the only person in the realm who can. The amirs grow uneasy. The ulama write sharp letters about a woman's place. What does the Sultan decree?"
 eranzamin_flavor.3.a:0 "Let her sit in the divan in her own right. Whoever objects may leave."
 eranzamin_flavor.3.b:0 "She is the previous regime's relic. Move her to a quiet estate."
 eranzamin_flavor.3.c:0 "We will marry her formally. Her legitimacy becomes our legitimacy."

 # ============================================================
 # 4. Yasa or Sharia
 # ============================================================
 eranzamin_flavor.4.title:0 "Yasa or Sharia"
 eranzamin_flavor.4.desc:0 "A noyan has killed a merchant for breaking a pact. The qadi demands his trial under Islamic law. The yarghuchi — the Mongol court — insists the man is theirs to judge by the Great Yasa of Genghis Khan. Both stand at the throne and will not yield. This is the question Ghazan never finally answered, and Abu Sa'id punted twenty years on. We cannot."
 eranzamin_flavor.4.a:0 "Sharia. The Yasa is the law of a vanished steppe."
 eranzamin_flavor.4.b:0 "The Yasa. The amirs will not be governed by clerks."
 eranzamin_flavor.4.c:0 "Both, for now. Yarghuchi for Mongols, qadi for everyone else."

 # ============================================================
 # 5. The Iqta Demand
 # ============================================================
 eranzamin_flavor.5.title:0 "The Iqta Demand"
 eranzamin_flavor.5.desc:0 "The senior amirs have come to the divan together — never a good sign. They want assignments. Specifically, they want iqta in the kharaj-paying provinces of our heartland, with full rights over the kotwal and the tax-collectors. They remind us, gently, of the cavalry we owe them. They remind us, less gently, that those cavalry follow them, not us."
 eranzamin_flavor.5.a:0 "Cash subsidy from the treasury. The provinces stay under the diwan."
 eranzamin_flavor.5.b:0 "Grant the iqta. We need the cavalry more than we need the kharaj."
 eranzamin_flavor.5.c:0 "Rotating governorships — they hold the land but the diwan rotates the holders."

 # ============================================================
 # 6. The Divan's Petition
 # ============================================================
 eranzamin_flavor.6.title:0 "The Divan's Petition"
 eranzamin_flavor.6.desc:0 "A delegation of mustawfis, qadis, and city notables stand at the throne. The peasants in the iqta-lands have begun to flee — to the cities, to the mountains, to anywhere but the lash of an amir's tax-farmer. The kharaj base is collapsing. They ask, not respectfully, whether the realm is governed by law or by horsemen."
 eranzamin_flavor.6.a:0 "The divan is correct. Investigate the worst offenders publicly."
 eranzamin_flavor.6.b:0 "The amirs hold the realm together. The peasants will adjust."
 eranzamin_flavor.6.c:0 "A confidential investigation. The diwan will write its own resolution."

 # ============================================================
 # 7. A Shaykh at Court
 # ============================================================
 eranzamin_flavor.7.title:0 "A Shaykh at Court"
 eranzamin_flavor.7.desc:0 "A Sufi shaykh has arrived with twenty murids — robed in coarse wool, walking from Ardabil. He has performed the dhikr in the bazaar for three days, and the bazaar has stopped working to listen. The ulama call him a heretic. The amirs were seen weeping. He asks the throne for nothing — but his disciples ask for a khanqah, with endowments. They will get it from someone."
 eranzamin_flavor.7.a:0 "Endow the khanqah. Better at our court than at our rival's."
 eranzamin_flavor.7.b:0 "A token gift. Let him build his own house, on his own land."
 eranzamin_flavor.7.c:0 "Expel him. Heterodoxy must not nest in the capital."

 # ============================================================
 # 8. The Dervish in the Bazaar
 # ============================================================
 eranzamin_flavor.8.title:0 "The Dervish in the Bazaar"
 eranzamin_flavor.8.desc:0 "A wandering qalandar has settled in the great bazaar, naked but for a goatskin, preaching that the Day of Judgement is at hand and that princes will be the first to burn. The crowd is large. The kotwal asks for instructions."
 eranzamin_flavor.8.a:0 "A small allowance. A fed dervish is a quiet dervish."
 eranzamin_flavor.8.b:0 "Have him moved to a khanqah outside the city. Politely."
 eranzamin_flavor.8.c:0 "Execute him. Order will be kept."

 # ============================================================
 # 9. The Khanqah Endowment
 # ============================================================
 eranzamin_flavor.9.title:0 "A Widow's Endowment"
 eranzamin_flavor.9.desc:0 "The widow of the late Amir Kichik has sold her husband's lands. She offers the proceeds to found a khanqah at the capital — quarters for travelers, kitchen for the poor, a hall for the dhikr. She asks that the Sultan lay the foundation stone. The ulama would prefer a madrasa. The choice is read by the realm."
 eranzamin_flavor.9.a:0 "Lay the stone in person. Walk among the murids."
 eranzamin_flavor.9.b:0 "Send the seal and the blessing. The Sultan need not attend personally."
 eranzamin_flavor.9.c:0 "Persuade the widow: a madrasa is more useful than a khanqah."

 # ============================================================
 # 10. The Lur and Kurd Chiefs
 # ============================================================
 eranzamin_flavor.10.title:0 "The Mountain Chiefs"
 eranzamin_flavor.10.desc:0 "Three chiefs of the Lur and the Kurd have ridden to the capital. They speak the same Iranian, more or less, as the divan's clerks. They will give cavalry, levy, and one annual tribute — in exchange for everything else. Their own qadis, their own customs, no kharaj men sent into the mountains. They have made the offer before, to others. They have made it to us now."
 eranzamin_flavor.10.a:0 "Accept their terms. The cavalry is real, the cost is small."
 eranzamin_flavor.10.b:0 "Full integration or nothing. They will be subjects, not partners."
 eranzamin_flavor.10.c:0 "Reject. They will learn what the alternative looks like."

 # ============================================================
 # 11. The Türkmen Migration
 # ============================================================
 eranzamin_flavor.11.title:0 "The Türkmen Migration"
 eranzamin_flavor.11.desc:0 "Tens of thousands of yurts are moving across the Diyarbakir corridor — Bayandur, Yiva, Döger, Afshar — the great Türkmen confederations of the Jazira have shifted pastures. Our marcher amirs report the flocks darken the hills from horizon to horizon. They will pass through our lands either way. The question is on what terms."
 eranzamin_flavor.11.a:0 "Grant the pastures. Bind them with hospitality, not steel."
 eranzamin_flavor.11.b:0 "Demand tribute for passage. They are guests on our land."
 eranzamin_flavor.11.c:0 "Settle them as askar in our military households. Make this our cavalry."

 # ============================================================
 # 12. The Anatolian Beg
 # ============================================================
 eranzamin_flavor.12.title:0 "The Anatolian Beg"
 eranzamin_flavor.12.desc:0 "A messenger from one of the Anatolian beyliks has crossed the Eretnid frontier in secret. His master tires of Eretnid suzerainty. He offers to ride under our banner — if we will recognize him as a tributary prince, with his lands intact. Refuse and the Eretnids tighten their grip; accept and the Eretnids will know within the month."
 eranzamin_flavor.12.a:0 "Accept the tributary. Anatolia is contested ground; we want our claim."
 eranzamin_flavor.12.b:0 "Refuse the offer and invade ourselves. No half-measures."
 eranzamin_flavor.12.c:0 "Send him home empty. We have no business in Anatolia."
