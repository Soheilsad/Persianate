 # ============================================================
 # 1. The Poet's Patron — Hafez of Shiraz
 # ============================================================
 eranzamin_flavor.1.title: "A Ghazal-Master in Shīrāz"
 eranzamin_flavor.1.desc: "A man named Hāfiz — Shams ud-Dīn Muhammad, called Hāfiz for his memorization of the Qurʾān — has gathered a circle of admirers in the Shirazi madrasas. His ghazals are passed hand-to-hand: wine, the rose, the absent Beloved, the hypocrisy of the pious. The poet asks for nothing, but his patrons say the meanings are deeper than the words. He will not leave Shīrāz, even for Baghdad or Bengal. He is in our city now. What do we do with him?"
 eranzamin_flavor.1.a: "Lavish patronage — let his verse be the jewel of our court."
 eranzamin_flavor.1.b: "A modest stipend. The court need not be a singing-house."
 eranzamin_flavor.1.c: "His verse mocks the pious. Send him away."

 # ============================================================
 # 2. The Mustawfi's Register
 # ============================================================
 eranzamin_flavor.2.title: "The Nuzhat ul-Qulūb"
 eranzamin_flavor.2.desc: "Hamdullah Mustawfī of Qazwīn, who served Rashīd ud-Dīn and his son Ghiyath ud-Dīn, has compiled a register: every province, every town, every river, every tax base from Khwarazm to the Mediterranean. He calls it the Nuzhat ul-Qulūb — 'The Pleasure of Hearts.' The dīwān wants it. The amīrs see in it the death of the iqtāʿ. What say we?"
 eranzamin_flavor.2.a: "Adopt it. Every kharāj in the realm shall be assessed by this book."
 eranzamin_flavor.2.b: "Reward the man. Then shelve the book — let no copies be made."
 eranzamin_flavor.2.c: "Excellent — we now know which lands to grant out as iqtāʿ!"

 # ============================================================
 # 3. The Dilshad Question (Jalayirid only)
 # ============================================================
 eranzamin_flavor.3.title: "Dilshad Khātūn"
 eranzamin_flavor.3.desc: "She was Abū Saʿīd's queen. Now she is at our court, and the dīwān-secretaries report to her before they report to us. She speaks for the Mongol noyans and for the Persian scribes alike — perhaps the only person in the realm who can. The amīrs grow uneasy. The ʿulamāʾ write sharp letters about a woman's place. What does the Sultān decree?"
 eranzamin_flavor.3.a: "Let her sit in the dīwān in her own right. Whoever objects may leave."
 eranzamin_flavor.3.b: "She is the previous regime's relic. Move her to a quiet estate."
 eranzamin_flavor.3.c: "We will marry her formally. Her legitimacy becomes our legitimacy."

 # ============================================================
 # 4. Yasa or Sharia
 # ============================================================
 eranzamin_flavor.4.title: "Yasa or Sharīʿa"
 eranzamin_flavor.4.desc: "A noyan has killed a merchant for breaking a pact. The qāḍī demands his trial under Islamic law. The yarghuchi — the Mongol court — insists the man is theirs to judge by the Great Yasa of Chinggis Khān. Both stand at the throne and will not yield. This is the question Ghazan never finally answered, and Abū Saʿīd punted twenty years on. We cannot."
 eranzamin_flavor.4.a: "Sharīʿa. The Yasa is the law of a vanished steppe."
 eranzamin_flavor.4.b: "The Yasa. The amīrs will not be governed by clerks."
 eranzamin_flavor.4.c: "Both, for now. Yarghuchi for Mongols, qāḍī for everyone else."

 # ============================================================
 # 5. The Iqta Demand
 # ============================================================
 eranzamin_flavor.5.title: "The Iqtāʿ Demand"
 eranzamin_flavor.5.desc: "The senior amīrs have come to the dīwān together — never a good sign. They want assignments. Specifically, they want iqtāʿ in the kharāj-paying provinces of our heartland, with full rights over the kotwal and the tax-collectors. They remind us, gently, of the cavalry we owe them. They remind us, less gently, that those cavalry follow them, not us."
 eranzamin_flavor.5.a: "Cash subsidy from the treasury. The provinces stay under the dīwān."
 eranzamin_flavor.5.b: "Grant the iqtāʿ. We need the cavalry more than we need the kharāj."
 eranzamin_flavor.5.c: "Rotating governorships — they hold the land but the dīwān rotates the holders."

 # ============================================================
 # 6. The Divan's Petition
 # ============================================================
 eranzamin_flavor.6.title: "The Dīwān's Petition"
 eranzamin_flavor.6.desc: "A delegation of mustawfīs, qāḍīs, and city notables stand at the throne. The peasants in the iqtāʿ-lands have begun to flee — to the cities, to the mountains, to anywhere but the lash of an amīr's tax-farmer. The kharāj base is collapsing. They ask, not respectfully, whether the realm is governed by law or by horsemen."
 eranzamin_flavor.6.a: "The dīwān is correct. Investigate the worst offenders publicly."
 eranzamin_flavor.6.b: "The amīrs hold the realm together. The peasants will adjust."
 eranzamin_flavor.6.c: "A confidential investigation. The dīwān will write its own resolution."

 # ============================================================
 # 7. A Shaykh at Court
 # ============================================================
 eranzamin_flavor.7.title: "A Shaykh at Court"
 eranzamin_flavor.7.desc: "A Sufi shaykh has arrived with twenty murīds — robed in coarse wool, walking from Ardabīl. He has performed the dhikr in the bazaar for three days, and the bazaar has stopped working to listen. The ʿulamāʾ call him a heretic. The amīrs were seen weeping. He asks the throne for nothing — but his disciples ask for a khānaqāh, with endowments. They will get it from someone."
 eranzamin_flavor.7.a: "Endow the khānaqāh. Better at our court than at our rival's."
 eranzamin_flavor.7.b: "A token gift. Let him build his own house, on his own land."
 eranzamin_flavor.7.c: "Expel him. Heterodoxy must not nest in the capital."

 # ============================================================
 # 8. The Dervish in the Bazaar
 # ============================================================
 eranzamin_flavor.8.title: "The Dervish in the Bazaar"
 eranzamin_flavor.8.desc: "A wandering qalandar has settled in the great bazaar, naked but for a goatskin, preaching that the Day of Judgement is at hand and that princes will be the first to burn. The crowd is large. The kotwal asks for instructions."
 eranzamin_flavor.8.a: "A small allowance. A fed dervish is a quiet dervish."
 eranzamin_flavor.8.b: "Have him moved to a khānaqāh outside the city. Politely."
 eranzamin_flavor.8.c: "Execute him. Order will be kept."

 # ============================================================
 # 9. The Khanqah Endowment
 # ============================================================
 eranzamin_flavor.9.title: "A Widow's Endowment"
 eranzamin_flavor.9.desc: "The widow of the late Amīr Kichik has sold her husband's lands. She offers the proceeds to found a khānaqāh at the capital — quarters for travelers, kitchen for the poor, a hall for the dhikr. She asks that the Sultān lay the foundation stone. The ʿulamāʾ would prefer a madrasa. The choice is read by the realm."
 eranzamin_flavor.9.a: "Lay the stone in person. Walk among the murīds."
 eranzamin_flavor.9.b: "Send the seal and the blessing. The Sultān need not attend personally."
 eranzamin_flavor.9.c: "Persuade the widow: a madrasa is more useful than a khānaqāh."

 # ============================================================
 # 10. The Lur and Kurd Chiefs
 # ============================================================
 eranzamin_flavor.10.title: "The Mountain Chiefs"
 eranzamin_flavor.10.desc: "Three chiefs of the Lur and the Kurd have ridden to the capital. They speak the same Iranian, more or less, as the dīwān's clerks. They will give cavalry, levy, and one annual tribute — in exchange for everything else. Their own qāḍīs, their own customs, no kharāj men sent into the mountains. They have made the offer before, to others. They have made it to us now."
 eranzamin_flavor.10.a: "Accept their terms. The cavalry is real, the cost is small."
 eranzamin_flavor.10.b: "Full integration or nothing. They will be subjects, not partners."
 eranzamin_flavor.10.c: "Reject. They will learn what the alternative looks like."

 # ============================================================
 # 11. The Türkmen Migration
 # ============================================================
 eranzamin_flavor.11.title: "The Türkmen Migration"
 eranzamin_flavor.11.desc: "Tens of thousands of yurts are moving across the Diyarbakir corridor — Bayandur, Yiva, Döger, Afshar — the great Türkmen confederations of the Jazira have shifted pastures. Our marcher amīrs report the flocks darken the hills from horizon to horizon. They will pass through our lands either way. The question is on what terms."
 eranzamin_flavor.11.a: "Grant the pastures. Bind them with hospitality, not steel."
 eranzamin_flavor.11.b: "Demand tribute for passage. They are guests on our land."
 eranzamin_flavor.11.c: "Settle them as askar in our military households. Make this our cavalry."

 # ============================================================
 # 12. The Anatolian Beg
 # ============================================================
 eranzamin_flavor.12.title: "The Anatolian Beg"
 eranzamin_flavor.12.desc: "A messenger from one of the Anatolian beyliks has crossed the Eretnid frontier in secret. His master tires of Eretnid suzerainty. He offers to ride under our banner — if we will recognize him as a tributary prince, with his lands intact. Refuse and the Eretnids tighten their grip; accept and the Eretnids will know within the month."
 eranzamin_flavor.12.a: "Accept the tributary. Anatolia is contested ground; we want our claim."
 eranzamin_flavor.12.b: "Refuse the offer and invade ourselves. No half-measures."
 eranzamin_flavor.12.c: "Send him home empty. We have no business in Anatolia."
 diwan_of_hafiz: "The Ghazals of Hāfiz"