l_english:
 iqta_grant: "Iqṭāʿ Grant"
 iqta_grant_desc: "A chancery-registered grant of the fiscal yield of this parcel to an amir, in exchange for the upkeep of his retinue. The grant is an act of paperwork — the *manshūr* of investiture, the qāḍī's registration — but its consequences are physical: the amir settles here with his clan and his lieutenants, and a new noble layer takes root on the land. They live off horses and herds, not registers; their literacy is shallow, and they will not promote into the diwan class while the iqṭāʿ stands.\n\nAvailable on rural locations where central authority has not yet reached. The amir's tribal authority fills the vacuum the chancery could not."
 STATIC_MODIFIER_NAME_iqta_building_fake_mod: "Offsetting Iqta Grant Effects, Hidden from building so AI will use it"
 STATIC_MODIFIER_DESC_iqta_building_fake_mod: "This modifier represents the actual effects of the iqṭāʿ grant on the local population and authority structure. It offsets effects given to the building to make the ai actually use the building."
 fake_manpower_tooltip: "For AI purposes, the building's actual effects are hidden. The building does not provide manpower, and reduces local literacy and control, but increases available heavy cavalry levies."
 STATIC_MODIFIER_NAME_circle_of_justice_food_and_rgo_offset: "Not Levying the Farmers."
 STATIC_MODIFIER_DESC_circle_of_justice_food_and_rgo_offset: "This modifier represents the fact that we are not levying the sedentary population for military service, and thus are not taking their food or RGO output."