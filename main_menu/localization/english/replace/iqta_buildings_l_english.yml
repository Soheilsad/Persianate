l_english:
 iqta_grant: "Iqtāʿ Grant"
 iqta_grant_desc: "A chancery-registered grant of the fiscal yield of this parcel to an amīr, in exchange for the upkeep of his retinue. The grant is an act of paperwork — the *manshūr* of investiture, the qāḍī's registration — but its consequences are physical: the amīr settles here with his clan and his lieutenants, and a new noble layer takes root on the land. They live off horses and herds, not registers; their literacy is shallow, and they will not promote into the dīwān class while the iqtāʿ stands.\n\nAvailable on rural locations where central authority has not yet reached. The amīr's tribal authority fills the vacuum the chancery could not."
 STATIC_MODIFIER_NAME_iqta_building_fake_mod: "Offsetting Iqtāʿ Grant Effects, Hidden from building so AI will use it"
 STATIC_MODIFIER_DESC_iqta_building_fake_mod: "This modifier represents the actual effects of the iqtāʿ grant on the local population and authority structure. It offsets effects given to the building to make the ai actually use the building."
 fake_manpower_tooltip: "For AI purposes, the building's actual effects are hidden. The building does not provide manpower, and reduces local literacy and control, but increases available heavy cavalry levies."
 STATIC_MODIFIER_NAME_circle_of_justice_food_and_rgo_offset: "The Farmers Left to Their Fields"
 STATIC_MODIFIER_DESC_circle_of_justice_food_and_rgo_offset: "This modifier represents the fact that we are not levying the sedentary population for military service, and thus are not taking their food or RGO output."
 boneh_and_rural_diwan_power: "The Boneh's Autonomy"
 STATIC_MODIFIER_NAME_collective_taxation_modifier: "Collective Taxation of Rural Subjects"
 STATIC_MODIFIER_DESC_collective_taxation_modifier: "This modifier represents the collective taxation of rural subjects under the Boneh system, which reduces Dīwān visibility"
 unaudited_iqta: "Unaudited Iqtāʿ"
 unaudited_iqta_desc: "The chancery granted this parcel and meant to keep it on a leash — the istīfā, the periodic audit, the standing right to call the grant back. The amīr has simply stopped answering the audit. Nothing is signed; the assessment just never comes again, and a revocable grant quietly becomes a permanent one. The crown's reach into this land recedes, the amīr's hand closes over it, and the realm tilts a hair further toward the saddle and away from the register.\n\nRaised by the Amīrs on any parcel that already carries an iqtāʿ grant."
 unaudited_iqta_tooltip: "The amīr has slipped the chancery's audit: this grant is now de facto permanent. Crown tax on the parcel falls, the Amīrs' local power and levy rise, and the realm drifts Turk."
 toyul: "Tuyul"
 toyul_desc: "The grant passes out of the service contract altogether. By hereditary tuyul or by soyurghal immunity, the parcel locks into the holder's lineage: the chancery cannot revoke it, the assessment never comes, and the yield belongs to the amīr's house in perpetuity. This is the terminus of the iqtāʿ's long decay — land that was the state's to assign is now, in all but name, a private patrimony that rides to war when it pleases and pays when it must.\n\nRaised by the Amīrs on a parcel already slipped past the audit, once the hereditary-tuyul or soyurghal privilege is held."
 toyul_tooltip: "Hereditary and lineage-locked: the chancery cannot pull this grant back. Crown tax on the parcel collapses, the Amīrs' local power and levy rise sharply, and the realm drifts Turk."
 waqf_buildings_tooltip_tt: "The elite will take note and begin sheltering their wealth in waqf endowments, which will erode the tax base over time."