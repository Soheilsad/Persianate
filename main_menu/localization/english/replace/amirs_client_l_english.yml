l_english:
 # Client kings of the ulus; the ground of a broken tümen
 ulus_client: "Client King of the Ulus"
 ulus_client_plural: "Client Kings of the Ulus"
 ulus_client_desc: "A settled house that keeps its own court and law under the ulus. It sends the qubchur and may pledge itself to one of the amīrs, lending him its whole weight as a tümen would. It is not an amīr: it has no hope of the khān, is not counted among the amīrs, and neither rises nor raids."
 client_of_the_ulus: "Client of the Ulus"
 client_of_the_ulus_desc: "The Friday sermon here is read in the khān's name, and the question every other Persianate court must answer is answered for this one. The house rules its valleys as it did before the Mongols came and pays for the privilege."
 opinion_ulus_raised_by_him: "Raised us to our place"
 amirs_client.1.title: "The Ground of a Broken Tümen"
 amirs_client.1.desc: "The horde that grazed around [SCOPE.sLocation('ulus_broken_seat_loc').GetName] has no army left. Its riders are dead or scattered to other camps, and what remains is the people who were always under them: cultivators, townsmen and the herders who did not ride. Nobody leads them. By the custom of the ulus a vacant pasture is given out again, and the one in a position to give it is us."
 amirs_client.1.a: "The pastures are ours."
 amirs_client.1.b: "Raise a chief of our choosing over a new tümen."
 amirs_client.1.c: "Set a settled house over it, under the ulus."
 amirs_client_take_tt: "Every place the broken house held, and nobody else has taken, becomes ours as #Y conquered#! land: no control to speak of until it is integrated."
 amirs_client_tumen_tt: "The ground becomes a horde again and an #Y Amīr of the Ulus#!, with a small following to begin with. Its chief is our #Y subject#! and thinks well of us (#G +50#! opinion); the whole weight of his tümen counts as ours in the ulus. He is an amīr like any other, and in time may want what amīrs want."
 amirs_client_king_tt: "The ground becomes a #Y Client King of the Ulus#!: a Persianate court that pays the qubchur, is our #Y subject#! (#G +50#! opinion) with its whole weight counted as ours in the ulus, and can never contend for the khān."
 amirs_regency.135.title: "The Office Hardens"
 amirs_regency.135.desc: "The amīrs came to the season's gathering as they came last year, took their places in the order we set, and went home. Nobody asked by what right we keep the khān. A thing done long enough without challenge stops being a seizure and becomes an office, and an office is something a son can be given."
 amirs_regency.135.a: "Let them grow used to it."
 amirs_regency_office_tt: "The stage has turned with our standing among the amīrs whole (the legitimacy gap #Y filled#!). #Y The Beglerbeg's Office#! gains a step, up to three. Each step: #G +5%#! crown power, #G +0.03#! monthly horde unity and prestige (one stage's worth of the regency's strain), and #G +10%#! to our heir's standing against the best rival.\n#italic The office goes with the khān: a state that loses him loses all of it.#!"
 STATIC_MODIFIER_NAME_beglerbeg_office_hardened: "The Beglerbeg's Office"
 STATIC_MODIFIER_DESC_beglerbeg_office_hardened: "The keeping of the khān has lasted long enough, unchallenged, to be treated as an office."
