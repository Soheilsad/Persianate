 STATIC_MODIFIER_NAME_badakhshan_gems_base: "The Lapis of Badakhshan"
 STATIC_MODIFIER_DESC_badakhshan_gems_base: "For six thousand years these mountains have been the world's only true source of lapis lazuli. The blue of Ur, of Tutankhamun's mask, and of every illuminator's ultramarine from Byzantium to Bukhara was quarried out of the Kuran wa Munjan valley and carried down on muleback. The spinels of Kuh-i Lal, which merchants call balas rubies, come from the same range."

 STATIC_MODIFIER_NAME_elton_salt_base: "The Salt Lake"
 STATIC_MODIFIER_DESC_elton_salt_base: "No shaft is sunk here and no ore is broken. The summer sun draws the water off and leaves a crust that carters rake up and haul away, and the lake yields again the following year without being worked. Nobody lives on the flats — there is no water to drink and nothing to graze — yet the salt of this one shore seasons the whole length of the Volga."

 STATIC_MODIFIER_NAME_perekop_salt_base: "The Perekop Pans"
 STATIC_MODIFIER_DESC_perekop_salt_base: "The shallow lagoons of the isthmus evaporate each summer into a floor of salt. The chumak carters come down in convoys of ox-waggons, load, and take the road north; the salt of this crossing has seasoned the Dnieper lands and the Polish plain for as long as anyone keeps count."

 STATIC_MODIFIER_NAME_sary_arka_copper_base: "The Copper of the Sary-Arka"
 STATIC_MODIFIER_DESC_sary_arka_copper_base: "Men have been smelting in these uplands since long before the Turks came, and the slag heaps of the old workings are still warm enough to follow. The ore is not the difficulty. The difficulty is that nothing grows here: every sack of grain that feeds a smelter has to be carried in from somewhere else."

 STATIC_MODIFIER_NAME_sary_arka_silver_base: "The Silver of Ulytau"
 STATIC_MODIFIER_DESC_sary_arka_silver_base: "The hills where Jochi lies buried carry silver as well as memory. The workings are ancient and shallow, the settlements small and provisioned from the herds, but the metal is real and it has been coming out of this ground for a very long time."

 STATIC_MODIFIER_NAME_gulf_pearl_banks_base: "The Pearl Banks"
 STATIC_MODIFIER_DESC_gulf_pearl_banks_base: "The banks off this coast are the richest pearl fishery on earth. For four months a year the boats go out and the divers go down on a rope with a stone and a nose-clip, and what they bring up is sold in Hormuz and Baghdad and Delhi and Cairo. The shore behind them is waterless rock that grows nothing at all; the season is the entire economy."

 naphtha_gathering: "Naphtha Gathering"
 naphtha_gathering_desc: "Where the ground bleeds oil, men have always found a use for it. It is skimmed off the seeps and drawn from shallow hand-dug pits, then carried away by the camel-load to be burnt in lamps, payed onto the hulls of ships, rubbed into the hides of mangy animals, prescribed by physicians, and — packed into a sealed pot with a wick — thrown by the naffāṭūn at men and walls. The fields of the Absheron burn with flames that never go out, and pilgrims come a long way to look at them."
