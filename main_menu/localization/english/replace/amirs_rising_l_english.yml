l_english:
 # Rising against the khan, and pledges (generic_actions/amirs_rising_actions.txt)
 ulus_rise_against_the_khan: "Rise Against the Khan"
 ulus_rise_against_the_khan_desc: "The amirs outweigh the throne, and one of them may say so with an army. We gain a casus belli on the khan's seat for five years. If we win the war the khan is killed, we take a prince of the line into our keeping, and the Amirs' Regency begins with us as regent, though with less standing than a regent who came by a khan's natural death. If we lose, the khan has broken the begs: we and every house pledged to us pay in silver and land, our ruler may be put to death, and no regency can begin for ten years."
 ulus_rising_kingmaker_tt: "We are among the three amirs best placed to take a khan (see #Y Standing in the ulus#!)"
 ulus_rising_bar_tt: "The begs outweigh the throne: one of the two bars on the Succession card is at its line"
 cb_rise_against_the_khan: "Rising Against the Khan"
 cb_rise_against_the_khan_desc: "An amir of the ulus against a khan the begs outweigh. Take his ordu and he is ours to replace."
 ulus_pledge_support: "Pledge Our Tümen"
 ulus_pledge_support_desc: "Stand behind another amir house. Half our weight in the ulus is counted as his: in the bar of the three greatest amirs against the khan, and in his standing as a kingmaker. If he takes the khan he owes us favours. We can pledge to one house at a time, and not to a house that has itself pledged. A pledge has no term. It stands until we take it back, until that house leaves the ulus or takes the seat itself, or until a rising it leads is broken. The Pledges card of the ulus lists every pledge that stands."
 ulus_not_pledged_tt: "We have not already pledged our tümen"
 ulus_pledge_effect_tt: "Half our weight counts as theirs until we take the pledge back. If they take the khan we gain #G 20#! favours with them and #G 10#! prestige."
 ulus_withdraw_pledge: "Take Back Our Pledge"
 ulus_withdraw_pledge_desc: "Our tümen stands for itself again. Our full weight is our own from the next reckoning."
 amirs_rising.1.title: "An Amir Has Risen"
 amirs_rising.1.desc: "It has been said aloud in the kuriltai that the khan rules by the sufferance of his begs. Now one of them has stopped suffering it. He has called his tümen and the tümens of those who owe him, and he does not pretend it is for a hunt.\n\nIf his riders reach the ordu, there will be another khan, and he will not be one of ours."
 amirs_rising.1.a: "Then he will be made an example the others can count."
 amirs_rising.2.title: "The Khan Is Dead"
 amirs_rising.2.desc: "They brought him out of the wreck of his guard, and it was done quickly. A khan cannot be kept after such a day, and cannot be let go.\n\nBut the felt cannot lie empty either. There is a prince of the line in our camp tonight who did not expect to be there. He will be raised in the morning, and he will be told what to sign."
 amirs_rising.2.a: "The ulus has a khan. It also has a master."
 amirs_rising_won_tt: "The #Y Amirs' Regency#! begins with us as regent. The legitimacy gap starts #R 15#! lower than usual: we killed a khan."
 amirs_rising.3.title: "The Rising Fails"
 amirs_rising.3.desc: "The amirs who swore they would ride did not ride, or rode late, or rode home when the first day went badly. The khan still sits, and every beg in the ulus now knows what a rising costs."
 amirs_rising.3.a: "We were right, and too early."
 amirs_rising_lost_tt: "We lose #R 20#! prestige and #R 15#! horde unity, pay the khan a year of our income, and give up two places outside our capital to the lords who stood with him. Every house pledged to us pays half as much and loses one place. No regency can begin in the ulus for #Y 10#! years. Our ruler may not leave the khan's tent alive; if he does, his own house may put him aside."
 amirs_rising.4.title: "The Begs Are Broken"
 amirs_rising.4.desc: "The amir who would have kept a khan in his tent has been beaten in the field, and the others have sent gifts and their sons to say that they never doubted the outcome. They are lying. For some years it will not matter."
 amirs_rising.4.a: "Let them remember whose ulus this is."
 amirs_rising_khan_won_tt: "We gain #G 15#! prestige and #G 10#! horde unity, and a year of the rebel's income. His land and his supporters' goes to the lords pledged to us, or to us if there are none. No regency can begin in the ulus for #Y 10#! years."
 amirs_rising.5.title: "A Tümen Is Pledged to Us"
 amirs_rising.5.desc: "An amir of the ulus has let it be known that his riders will stand where ours stand. He asks nothing for it today. He will ask on the day it has paid."
 amirs_rising.5.a: "He has chosen well."
 amirs_rising.6.title: "Our Man Holds the Khan"
 amirs_rising.6.desc: "The house we pledged our tümen to has taken the khan into its keeping. We stood with it when that was a wager. It is now a debt, and he knows what he owes."
 amirs_rising.6.a: "We will not be slow to collect."
 amirs_rising_pledge_paid_tt: "We gain #G 20#! favours with the new regent and #G 10#! prestige."
 ulus_ask_for_pledge: "Ask for a Pledge"
 ulus_ask_for_pledge_desc: "Ask another amir house to stand behind us. If it agrees, its whole weight in the ulus is counted as ours and it drops out of the reckoning for the khan itself, in the bar of the three greatest amirs and in our standing as a kingmaker, and we owe it favours on the day we take the khan. A house agrees for reasons: what it thinks of us, a marriage or an alliance between us, how far we outweigh it. A house with hopes of the khan itself will not. Hover a house in the list to see what it will answer and why; a house that refuses still costs us the asking. A pledge has no term: it stands until that house takes it back."
 ulus_ask_not_pledged_tt: "This house has not already pledged its tümen"
 ulus_ask_acceptance_tt: "This house would agree. It weighs: its opinion of us (a sixth of it counts), a royal marriage with us (#G +25#!), an alliance (#G +15#!), rivalry (#R −100#!), our weight against its own (#G +30#! if we are twice as heavy, #G +15#! if a quarter heavier, up to #R −100#! if we are the lighter, by how much), whether it is itself among the three likeliest kingmakers (up to #R −66#!, most for the likeliest) and whether we are (#G +10#!), against a reluctance of #R −25#!"
 amirs_rising.7.title: "An Amir Asks for Our Tümen"
 amirs_rising.7.desc: "A messenger has come from another house of the ulus with gifts that are generous without being a bribe, and a proposal that is polite without being vague. He asks that our riders stand where his stand. Half of what we weigh in the councils of the ulus would be counted as his. If he comes to hold the khan, he will remember who stood with him when it was a wager.\n\nIf he does not, we will have spent our name on another man's ambition."
 amirs_rising.7.a: "Our tümen stands with his."
 amirs_rising.7.b: "Our tümen stands for itself."
 amirs_rising.8.title: "The Pledge Is Refused"
 amirs_rising.8.desc: "The answer came back courteous and empty. They wish us fortune, they remember the friendship between our fathers, and their tümen will stand for itself."
 amirs_rising.8.a: "They will wish they had chosen sooner."

 # The khan's side, the feud, friends outside
 ulus_khan_ask_pledge: "Ask a Lord to Stand with the Seat"
 ulus_khan_ask_pledge_desc: "The great amirs are the danger; the lesser lords are the remedy. Ask a house that is not among the three likeliest kingmakers to pledge its tümen to the khan. Half its weight is counted as ours against the three greatest amirs. It is paid in silver and honour now, and when a rising is broken, the rebels' land goes to the lords who stood with us."
 ulus_khan_ask_lesser_tt: "This house is not among the three likeliest kingmakers"
 ulus_khan_ask_acceptance_tt: "This house would agree. It weighs: its opinion of us (a sixth of it counts), a royal marriage (#G +25#!), an alliance (#G +15#!), rivalry (#R −100#!), whether we still outweigh it (#G +25#! at twice its weight, #G +10#! if heavier, #R −20#! if lighter), how close the amirs are to overruling us (up to #R −30#!), and a great amir on its own border (#G +15#!), against a reluctance of #R −15#!"
 ulus_press_the_feud: "Press the Feud"
 ulus_press_the_feud_desc: "The amirs have fallen out and the tümens have chosen their sides. As a house that has pledged, or that others have pledged to, we may take up our bloc's quarrel with a house of another: a casus belli on it for five years."
 ulus_feud_in_a_bloc_tt: "We have pledged our tümen to a house, or another house has pledged to us"
 ulus_feud_other_bloc_tt: "This house stands in a different bloc from ours"
 cb_tumen_feud: "Feud of the Tümens"
 cb_tumen_feud_desc: "The houses of the ulus have taken sides over who shall keep the khan, and this one stands on the other."
 TUMEN_FEUD_WAR_NAME: "The $NUM$$ORDER$ $FIRSTNAME$–$SECONDNAME$ Feud"
 ulus_ask_outside_support: "Seek a Patron Outside the Ulus"
 ulus_ask_outside_support_desc: "Ask a power beyond the ulus to back us. A backer is not an ally: he owes us no riders and we owe him none. He counts for a share of what he would weigh in the ulus, less than an ally would, and if we come to hold the khan we owe him favours. He will do it to trouble the khan, so he wants a contender who can make trouble and cannot win without him."
 ulus_no_outside_backer_tt: "We have no patron outside the ulus already"
 ulus_outsider_backs_nobody_tt: "This realm is not already backing another amir"
 ulus_outside_acceptance_tt: "This realm would agree. It weighs: its opinion of us (a sixth of it counts), its quarrel with the khan's seat (#G +30#! if rivals, #G +10#! if neighbours, #R −100#! if allies), our standing among the amirs (#G +25#! if we are a real contender but not the strongest, #R −10#! if we are the strongest, #R −30#! if we are no contender at all), and its own temperament, against a reluctance of #R −20#!"
 ulus_back_an_amir: "Back an Amir of the Ulus"
 ulus_back_an_amir_desc: "The khan of the Chaghatay rules by the sufferance of his amirs, and an amir with silver behind him is a harder man to rule. Choose a house to back. We owe it no riders and it owes us none, but our weight is counted behind it in the councils of the ulus, and if it comes to hold the khan it will owe us favours. The khan will not thank us."
 ulus_outsider_backs_nobody_self_tt: "We are not already backing an amir of the ulus"
 ulus_no_outside_backer_theirs_tt: "This house has no patron outside the ulus already"
 amirs_rising.9.title: "The Khan Asks for Our Tümen"
 amirs_rising.9.desc: "The khan's messenger did not come to command, which is new. He came with a robe, a purse, and a careful account of how much the great amirs have grown, and how little any of them would leave to a house of our size once the khan is a boy in somebody's tent.\n\nHe asks that our riders be counted as the khan's. If the great amirs rise and are broken, their land will have to go to someone."
 amirs_rising.9.a: "We stand with the seat."
 amirs_rising.9.b: "We stand where we have always stood. Apart."
 amirs_rising_khan_pledge_tt: "Half our weight in the ulus counts as the khan's until we take the pledge back. We gain #G 5#! prestige now. If a rising against the khan fails, the rebels' land is shared among the lords pledged to him."
 amirs_rising.10.title: "A Lord Stands with the Seat"
 amirs_rising.10.desc: "One of the lesser houses has answered. Its tümen is small, but it is counted with ours now, and the great amirs will have counted it too."
 amirs_rising.10.a: "One at a time."
 amirs_rising.11.title: "An Amir of the Chaghatay Seeks a Patron"
 amirs_rising.11.desc: "A house of the ulus has sent to us, discreetly. It does not ask for riders or for a treaty its khan could read. It asks for silver, for our name to be spoken behind it when the amirs sit in council, and for our patience.\n\nIn return it offers what such men always offer: gratitude, later, if things go well. What it offers without saying so is a khan with one more thing to worry about."
 amirs_rising.11.a: "Let it be known that this house has friends."
 amirs_rising.11.b: "The quarrels of the ulus are its own."
 amirs_rising_outside_backing_tt: "We back this house: a share of our weight counts as its own in the ulus. If it comes to hold the khan we gain #G 20#! favours with it. The khan's opinion of us falls."
 amirs_rising.12.title: "We Backed the Wrong Man"
 amirs_rising.12.desc: "The amir we pledged our tümen to rose against the khan and was broken. The khan's men have come with a list. Our name is on it, lower down than his, which is the only mercy in it."
 amirs_rising.12.a: "Pay, and remember."
 amirs_rising_supporter_tt: "We pay the khan six months of our income and give up one place outside our capital. Our pledge is void."
 amirs_rising.13.title: "A Patron Beyond the Ulus"
 amirs_rising.13.desc: "A power outside the ulus has let it be understood that it stands behind us. No treaty says so, and none needs to. The other amirs can count."
 amirs_rising.13.a: "And the khan can count too."
 amirs_rising.14.title: "Our Man Holds the Khan"
 amirs_rising.14.desc: "The house we chose to back among the Chaghatay has taken the khan into its keeping. What we spent was silver. What we are owed is the gratitude of the man who rules the ulus."
 amirs_rising.14.a: "A sound investment."
 amirs_rising_backer_paid_tt: "We gain #G 20#! favours with the new regent."
 # The reckoning, shown in the row's tooltip (scripted_effects/19_amirs_rising_effects.txt)
 ulus_reckon_player_tt: "#Y They will decide for themselves.#!"
 ulus_reckon_agree_tt: "#G They will agree.#! What they weigh:"
 ulus_reckon_refuse_tt: "#R They will refuse#!, and asking still costs us. What they weigh:"
 ulus_reckon_reluctance_25_tt: "  A tümen is not lent for nothing: #R −25#!"
 ulus_reckon_reluctance_15_tt: "  A lord's caution: #R −15#!"
 ulus_reckon_reluctance_20_tt: "  A stranger's caution: #R −20#!"
 ulus_reckon_opinion_high_tt: "  They think well of us: #G +17 or more#! (a sixth of their opinion)"
 ulus_reckon_opinion_mid_tt: "  They think little of us either way: #G 0 to +16#! (a sixth of their opinion)"
 ulus_reckon_opinion_low_tt: "  They think ill of us: #R below 0#! (a sixth of their opinion)"
 ulus_reckon_marriage_25_tt: "  Our houses are joined by marriage: #G +25#!"
 ulus_reckon_alliance_15_tt: "  We are allies: #G +15#!"
 ulus_reckon_rival_100_tt: "  We are rivals: #R −100#!"
 ulus_reckon_twice_30_tt: "  We are twice their weight or more: #G +30#!"
 ulus_reckon_heavier_15_tt: "  We are clearly the heavier house: #G +15#!"
 ulus_reckon_even_tt: "  We are no heavier than they are: #Y 0#!"
 ulus_reckon_lighter_tt: "  We are the lighter house: #R down to −100#!, by how much lighter"
 ulus_reckon_own_hopes_tt: "  They have hopes of the khan themselves: #R down to −66#!"
 ulus_reckon_we_contend_10_tt: "  We are among the three likeliest to take the khan: #G +10#!"
 ulus_reckon_khan_twice_25_tt: "  The seat is twice their weight or more: #G +25#!"
 ulus_reckon_khan_heavier_10_tt: "  The seat still outweighs them: #G +10#!"
 ulus_reckon_khan_lighter_20_tt: "  They outweigh the seat itself: #R −20#!"
 ulus_reckon_khan_sinking_tt: "  How near the amirs are to overruling the khan: #R down to −30#!"
 ulus_reckon_khan_counterweight_15_tt: "  One of the great amirs is their neighbour: #G +15#!"
 ulus_reckon_out_khans_ally_tt: "  They are allies of the khan's seat: #R −100#!"
 ulus_reckon_out_khans_rival_tt: "  They are rivals of the khan's seat: #G +30#!"
 ulus_reckon_out_khans_neighbour_tt: "  They border the khan's seat: #G +10#!"
 ulus_reckon_out_too_strong_tt: "  We are the strongest of the amirs and would not need them long: #R −10#!"
 ulus_reckon_out_contender_tt: "  We can trouble the khan and cannot win without help: #G +25#!"
 ulus_reckon_out_too_weak_tt: "  We are no contender: #R −30#!"
 ulus_reckon_out_temper_tt: "  Their own temper, from #R −30#! for a realm that keeps to itself to #G +15#! for one that sees an opening"
 amirs_rising.15.title: "No Patron There"
 amirs_rising.15.desc: "Our envoy was received with every courtesy and sent home with a letter that says nothing. They do not think our quarrel worth their silver."
 amirs_rising.15.a: "Then we look elsewhere."
 ulus_ask_not_a_subject_tt: "This house is not the subject of another house of the ulus"
 ulus_reckoning_already_pledged_tt: "It has already pledged its tümen: #R -30#!, and a sixth of the difference between what it thinks of us and what it thinks of the house it stands behind. If it comes over, that house will hold it against both of us."
 opinion_ulus_keeps_what_is_ours: "Keeps the khan who is ours as much as his"
 opinion_ulus_pledge_broken: "A pledged tümen was talked away"
