 AUTO_MODIFIER_NAME_borjigin_yam_reach: "The Yam and the Ordu"
 AUTO_MODIFIER_DESC_borjigin_yam_reach: "The relay posts of the yam and the seasonal march of the khan's own ordu carry authority across open country faster than any settled chancery can manage — but only for a khan whose blood the tümens acknowledge. Distance across flatland costs this realm far less than it costs its neighbours. Hills, plateau, mountain and wetland are unchanged."

 horde_reach.1.title: "The Reach of the Yam"
 horde_reach.1.desc: "Sarai is where the khan winters. It is not the empire.\n\nWhen the grass rises the ordu moves, and the realm moves with it — tents struck and loaded, the markets and the mosques riding on their carts, the households of the khatuns in their proper order, the herds driven ahead and the tümens spread wide on either hand. A traveller out of the Maghrib who rode with us last year wrote that he could never find where the city ended.\n\nWhat the chancery is to a sultan in Tabriz, the yam is to us. A post at every stage, and fresh horses at every post; a man with the paiza at his belt rides from the Danube to the Irtysh, and the khan's word arrives ahead of the rumour of it. Our tümens are not called up out of provinces. They are the provinces. Wherever the grass runs they can be found, counted and summoned, and the distance between them is a matter of days.\n\nBeyond the grass it is another thing entirely. In the forest the horses founder and the villages hide themselves; in the mountains every pass belongs to men who were born in it. There we do not muster. There we appoint, and take the tribute, and send someone to watch it counted."
 horde_reach.1.a: "Where the grass runs, the khan's word runs."

 horde_local_appointee: "Darugha's Seat"
 horde_local_appointee_desc: "A resident man of the khan's, posted to hold a settled place: the darugha of the Persian registers, the basqaq of the Rus chronicles. He is not a governor in the sultanate's sense — he keeps no chancery and writes no law. He holds the census, sees the assessment collected, stands between the townsmen and the tümens, and is answerable to the ordu wherever the ordu happens to be that season.\n\nQutlugh-Temür held Khwarazm from Urgench in exactly this way, married to a Chinggisid princess and outranking every merchant on the Amu Darya. Tuluktumur held Crimea from Solkhat. The traveller from Tangier dined with both of them.\n\nUnlike the chancery's own governor, the darugha needs no road to the capital — the khan's authority arrives by relay horse, and it arrives whether or not anyone has built a road. He is a source of proximity in his own right, so the country around him ceases to be measured from Sarai and begins to be measured from him. He requires no city: a district centre is enough.\n\nHe holds the place for a khan of the blood, and for no one else. When the line fails, he is simply a man in a town."
 horde_local_appointee_tt: "The total of $horde_local_appointee$, $local_governor$ and $lieutenancy$ in our realm is below our permitted number of appointees."

 horde_reach.10.title: "The Question of the Far Country"
 horde_reach.10.desc: "The tax farmers have come back from the country about [scope:reach_seat.GetName] with less than they went out with, and the answer is the same answer we were given last year: the khan's word arrives there, and then nothing happens.\n\nThis is not rebellion. Nobody in that country has raised a standard or refused a summons. It is simply that the ordu does not pass that way, the yam's last post is a long ride short of it, and a man standing in that market has not seen anyone who could compel him since the snows before last. Authority that arrives once a season and leaves again is not authority. It is a visit.\n\nThere are three answers and they have always been the same three.\n\nPost a man of ours — a darugha, with a guard and a tally and the ordu behind his name. He holds the place for us, he is ours to recall, and he can never be more than what we made him. But he is one more amir with a district, and the amirs already know how to count each other.\n\nOr give the country away, properly, to one of the line — his tümens, his pastures, his law, his own succession. He will hold it as no appointee ever could, because it will be his. And what is his will one day be his sons', and his sons will be of the blood, and the blood is the only thing that has ever been worth killing a khan for.\n\nOr buy a man who has nothing. No kin to raise, no tribe to raise them, no pasture he can call his own — paid in silver every season for as long as we can find the silver, and worth precisely nothing to anyone the day we cannot."
 horde_reach.10.a: "Post a darugha. Let him keep the registers and remember who sent him."
 horde_reach.10.b: "It is a son of the line who should hold it. Give him his share, and let him earn it."
 horde_reach.10.c: "Buy a man with no name and no people. Those are the only servants who stay servants."
 horde_reach.10.d: "Let it lie dark. We have held worse and lost less."

 horde_reach.20.title: "A Darugha Is Appointed"
 horde_reach.20.desc: "[scope:new_darugha.GetName] has taken up the seat at [scope:darugha_seat.GetName], and by every account we have he is the right man for it.\n\nHe came up in the tümens and he has the scars to show where. He can read an assessment and tell when a town's headmen are lying about the harvest, which is rarer than it sounds. He keeps his own guard, well mounted and well paid, and the merchants on that road have already worked out whose name to use. Within a season the registers will be in order and the tribute will come in on time, and that is precisely why he was chosen: this is not an office we can afford to fill with a fool.\n\nAnd there is the other thing, which no one at the ordu will say aloud.\n\nHe is not of the line. He never will be, and no ambition of his can ever change it — no beg has ever been raised on the felt and none ever will be. But a man who holds a district holds men, and a man who holds enough men has learned that he does not need to wear the title. He only needs to stand close enough to whoever does.\n\nHe will serve the khan faithfully. The question the ordu never asks is which khan, and on whose terms."
 horde_reach.20.a: "Good. A realm is held by men, and we have found one."

 horde_appointee_maintenance: "The Darugha's Household"
 horde_appointee_maintenance_desc: "The appointee's establishment: his guard, his scribes, his horses, and the registers he keeps of who owes what. Lighter on paper and heavier on arms than a settled governor's seat — his authority rests on the tümens standing behind him rather than on the archive in front of him."
