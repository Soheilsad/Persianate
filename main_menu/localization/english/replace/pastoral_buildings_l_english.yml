l_english:
 # ============================================================
 # Pastoral buildings — the īl and the amīr
 # See in_game/common/building_types/0012_pastoral_buildings.txt
 # ============================================================

 # ----- Tribal Pasture -----
 tribal_pasture: "Tribal Pasture"
 tribal_pasture_desc: "The īl's own grazing range — the open yaylāq–qishlāq circuit that the tribe moves its herd between in the warm season and the cold. Not a parcel and not a stud farm; a transhumance claim recognized by amīr and chancery alike, on which 5,000 tribesmen per level make their pastoral living. The herd is wealth, food, mount, and levy — the household's whole economy lives on horseback and beside the flock.\n\nThe grass that feeds the herd is grass that is not ploughed, and the building bites hard into the location's carrying capacity: at full extent (five levels) the ploughmen must leave. This is how the medieval Iranian plateau and post-Mongol Khurasan actually worked — Türkmen confederations driving cultivation back to the irrigated cores, the open country a sea of pasture and the towns small islands in it. The state may halt the tide; the building does not."
 tribal_pasture_grazing: "Open Range Grazing"
 tribal_pasture_grazing_desc: "Horses raised on grass. No stored fodder, no stall — the herd moves with the season, and what the herd needs the land provides without intermediary. The cost is in the land itself: pasture displaces ploughland, and the human carrying capacity falls as the herd's grows."

 # ----- Amīr's Herd -----
 amirs_herd: "Amīr's Herd"
 amirs_herd_desc: "The amīr's organized stud — the formal counterpart to the open īl-range. A defined parcel under a single amīr's authority, on which 3,000 tribesmen per level tend a managed herd that is the amīr's standing cavalry reserve. The institution sits closer to the iqṭāʿ than to the tribal pasture: a recognized grant, a defined boundary, a master's accountable hand.\n\nLighter on the location's carrying capacity than the open range, because the amīr's herd does not claim the whole transhumance circuit. Higher levy throughput per pop, because the amīr converts horseflesh into ready cavalry more reliably than the open īl does — his men muster when called, not when the season permits."
