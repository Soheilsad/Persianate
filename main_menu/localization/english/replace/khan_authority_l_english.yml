l_english:
 # The Khān's Authority (scripted_effects/24_khan_authority_effects.txt)
 ULUS_AUTHORITY_CARD: "The Khān's Authority"
 ULUS_AUTHORITY_FROZEN: "Nothing moves here while a beg keeps the khān."
 ULUS_AUTHORITY_LABEL: "Authority (of 100)"
 ULUS_AUTHORITY_MONTH_LABEL: "Change each month"
 ULUS_AUTHORITY_TT: "The khān's standing with his amīrs. It is his own: a new khān has half his predecessor's, and never less than 10.\n\n#Y Each month:#! #G +0.03#! while a grown khān rules (#R -0.05#! under a child or a regent), #G +0.04#! while his crown outweighs his own begs, #G +0.05#! once the Yearly Quriltai stands, #G +0.02#! for each lord pledged to the seat, #R -0.10#! for each house in open defiance.\n\n#Y Deeds:#! a war won #G +8#!, a great battle #G +1#!, a defiant house broken in war #G +10#!, a decree every house obeys #G +3#!. A war lost #R -10#!, a decree refused by the heavier part of the ulus #R -15#!, a charter of immunity granted #R -8#!."
 ULUS_AUTHORITY_BAR_LABEL: "The three greatest amīrs must outweigh him by"
 ULUS_AUTHORITY_BAR_TT: "How many times the khān's weight his three greatest amīrs must hold together before they can raise a khān of their own at his death, or one of them can rise against him.\nIt is 4 times (0.5 + authority ÷ 100): #Y 2.0#! with no authority, #Y 4.0#! at 50, #Y 6.0#! at 100."
 ULUS_DECREES_LABEL: "Decrees standing (of 5)"
 ULUS_DECREES_TT: "The khān's decrees, each needing the one before it and more authority than the last:\n1. #Y The Yearly Quriltai#! (authority 20)\n2. #Y Kebek's Assessment#! (30)\n3. #Y Darughas in the Towns#! (40)\n4. #Y The Khān Confirms#! (50)\n5. #Y The Tümens Are the Khān's#! (60)\nThen #Y One Ulus, One Khān#! (75, no house in defiance, and every house without a charter willing): the ulus becomes one realm.\n\nThey are proclaimed from the actions of the ulus, by the khān."
 ULUS_DECREE_FOR_LABEL: "Next decree: weight that would obey (the khān's with it)"
 ULUS_DECREE_AGAINST_LABEL: "Next decree: weight that would refuse"
 ULUS_DECREE_RECKONING_TT: "Every amīr house is asked, one by one. A house obeys if its reckoning is not negative:\n#G +#! the khān's weight × (0.5 + authority ÷ 100)\n#R −#! the house's own weight, with the tümens and friends behind it\n#R −#! 1.5 for each decree already standing\n#G +#! a twentieth of what it thinks of the khān\n#G +#! 3 for a marriage with the seat\nA house pledged to the khān, or his subject, always obeys. Hover any house in the list of amīrs to see its reckoning.\n\n#Y If the weight that refuses is greater than the weight that obeys, the decree fails#!: it is withdrawn, the khān loses 15 authority, and it cannot be tried again for ten years.\n#Y Otherwise it stands#! and binds the houses that obeyed. Each house that refused is in open defiance."
 ULUS_DECREE_HOUSE_LINE: "#T On the khān's next decree#!\nReckoning: [Country.MakeScope.GetVariable('ulus_decree_margin').GetValue|1+=] (obeys at 0 or more)"
 ULUS_DEFIANT_HEADER: "Houses in open defiance"
 ULUS_DEFIANT_TT: "These houses refused a decree. They follow none of its terms, each costs the khān #R 0.10#! authority a month, and he holds a casus belli on each that lets him make war on it inside the ulus.\n\nHe can end a house's defiance four ways:\n• #Y break it#!: win the war, and it obeys every decree standing (#G +10#! authority);\n• #Y win it over#! with gifts (the action Win Over a House), if it does not think too ill of him;\n• #Y grant it a charter#! (the action Grant a Charter): it is free of the decrees it refused for good, and he loses #R 8#! authority;\n• #Y outlast it#!: after five years it comes round of itself if its reckoning has turned."
 ULUS_DEFIANT_ROW_TT: "$ULUS_WEIGHT_BREAKDOWN$\n\n$ULUS_DECREE_HOUSE_LINE$"
 ULUS_DEFIANT_ROW_WEIGHT: "weight [Country.MakeScope.GetVariable('ulus_weight_eff').GetValue|1]"
 ULUS_DECREE_ASSESSMENT_MULTIPLIER: "Kebek's assessment on the houses that obey it"
 ulus_decree_1: "Decree: The Yearly Quriltai"
 ulus_decree_1_desc: "The khān calls the houses together every year, as the yasa requires, and they come. His authority grows by #G 0.05#! a month while this stands.\n\nEvery amīr house is asked whether it will obey. The decree stands if the weight that obeys, the khān's included, is at least the weight that refuses; a house that refuses is then in open defiance. If the heavier part refuses, the decree fails."
 ulus_decree_1_effect_tt: "#T The Yearly Quriltai#!\nThe khān calls the houses together every year, as the yasa requires, and they come. His authority grows by #G 0.05#! a month while this stands."
 ulus_decree_needs_authority_1_tt: "The khān's authority is at least #Y 20#!"
 ulus_decree_2: "Decree: Kebek's Assessment"
 ulus_decree_2_desc: "One coinage and one assessment across the ulus. The houses that obey are assessed for the qubchur at half as much again.\n\nEvery amīr house is asked whether it will obey. The decree stands if the weight that obeys, the khān's included, is at least the weight that refuses; a house that refuses is then in open defiance. If the heavier part refuses, the decree fails."
 ulus_decree_2_effect_tt: "#T Kebek's Assessment#!\nOne coinage and one assessment across the ulus. The houses that obey are assessed for the qubchur at half as much again."
 ulus_decree_needs_authority_2_tt: "The khān's authority is at least #Y 30#!"
 ulus_decree_3: "Decree: Darughas in the Towns"
 ulus_decree_3_desc: "The khān's own men sit in the towns of the houses that obey. For each such house he gains #G 1%#! crown power; each of them loses #R 10%#! of its begs' power.\n\nEvery amīr house is asked whether it will obey. The decree stands if the weight that obeys, the khān's included, is at least the weight that refuses; a house that refuses is then in open defiance. If the heavier part refuses, the decree fails."
 ulus_decree_3_effect_tt: "#T Darughas in the Towns#!\nThe khān's own men sit in the towns of the houses that obey. For each such house he gains #G 1%#! crown power; each of them loses #R 10%#! of its begs' power."
 ulus_decree_needs_authority_3_tt: "The khān's authority is at least #Y 40#!"
 ulus_decree_4: "Decree: The Khān Confirms"
 ulus_decree_4_desc: "No house that obeys seats a new chief without the khān's yarligh. Such a house counts for half as much as a kingmaker when a khān dies.\n\nEvery amīr house is asked whether it will obey. The decree stands if the weight that obeys, the khān's included, is at least the weight that refuses; a house that refuses is then in open defiance. If the heavier part refuses, the decree fails."
 ulus_decree_4_effect_tt: "#T The Khān Confirms#!\nNo house that obeys seats a new chief without the khān's yarligh. Such a house counts for half as much as a kingmaker when a khān dies."
 ulus_decree_needs_authority_4_tt: "The khān's authority is at least #Y 50#!"
 ulus_decree_5: "Decree: The Tümens Are the Khān's"
 ulus_decree_5_desc: "The khān may assign the commands of the houses that obey. A quarter of each such house's weight stands behind the seat, and counts for him in the bar.\n\nEvery amīr house is asked whether it will obey. The decree stands if the weight that obeys, the khān's included, is at least the weight that refuses; a house that refuses is then in open defiance. If the heavier part refuses, the decree fails."
 ulus_decree_5_effect_tt: "#T The Tümens Are the Khān's#!\nThe khān may assign the commands of the houses that obey. A quarter of each such house's weight stands behind the seat, and counts for him in the bar."
 ulus_decree_needs_authority_5_tt: "The khān's authority is at least #Y 60#!"
 ulus_decree_not_failed_lately_tt: "No decree has been refused by the heavier part of the ulus in the last ten years"
 ulus_decree_reckoning_tt: "#T How the houses will answer#!\n#G Would obey:#! [GetUniqueInternationalOrganization('ulus_chaghatay').MakeScope.GetVariable('ulus_decree_obey_count').GetValue|0] houses. #R Would refuse:#! [GetUniqueInternationalOrganization('ulus_chaghatay').MakeScope.GetVariable('ulus_decree_refuse_count').GetValue|0] houses. Their names are on the ulus panel, under The Khān's Authority; hover a house in the list of amīrs for its reckoning."
 ulus_decree_will_stand_tt: "#G The decree will stand.#! Weight that obeys, ours included: #Y [GetUniqueInternationalOrganization('ulus_chaghatay').MakeScope.GetVariable('ulus_decree_for').GetValue|1]#!. Weight that refuses: #Y [GetUniqueInternationalOrganization('ulus_chaghatay').MakeScope.GetVariable('ulus_decree_against').GetValue|1]#!.\nOn each house that refuses we gain a casus belli that lets us make war on it inside the ulus, and we lose #R 0.10#! authority a month while its defiance stands. If every house obeys we gain #G 3#! authority."
 ulus_decree_will_fail_tt: "#R The decree will FAIL.#! Weight that obeys, ours included: #Y [GetUniqueInternationalOrganization('ulus_chaghatay').MakeScope.GetVariable('ulus_decree_for').GetValue|1]#!. Weight that refuses: #Y [GetUniqueInternationalOrganization('ulus_chaghatay').MakeScope.GetVariable('ulus_decree_against').GetValue|1]#!.\nIt will be withdrawn. We lose #R 15#! authority, the houses that refused think the worse of us, and no decree can be proclaimed for ten years."
 ulus_decree_6: "Decree: One Ulus, One Khān"
 ulus_decree_6_desc: "The five decrees stand and no house defies them. The khān declares what they have already made true: there is one ulus and it is his. The houses that obey are taken into his realm; those that hold his charter, and the client kings, remain as his subjects."
 ulus_decree_6_effect_tt: "#T One Ulus, One Khān#!\nEvery house that obeys is taken into our realm with its men, its treasury and its people. Houses holding our charter and the client kings become our subjects. #Y Ulus Chaghatay ceases to exist as an organisation: we are the khanate.#!\nWe gain #G 50#! horde unity and #G 50#! prestige, and for thirty years #G +25%#! levy size, #G +10%#! morale, #G -50%#! antagonism and a casus belli, renewed each year, on every other horde we border."
 ulus_decree_needs_authority_6_tt: "The khān's authority is at least #Y 75#!"
 ulus_decree_no_defiance_tt: "No house stands in open defiance"
 ulus_decree_all_would_obey_tt: "Every house that holds no charter would obey"
 ulus_win_over_a_house: "Win Over a House"
 ulus_win_over_a_house_desc: "Send a house in open defiance robes, horses and a place of honour at the quriltai. If it does not think too ill of us it takes them, gives up its defiance and obeys every decree standing."
 ulus_win_over_opinion_tt: "Their opinion of us is at least #Y -50#!"
 ulus_win_over_effect_tt: "This house gives up its defiance and obeys every decree standing that it holds no charter against. It thinks better of us (#G +40#! opinion) and we gain #G 2#! authority."
 ulus_grant_tarkhan: "Grant a Charter"
 ulus_grant_tarkhan_desc: "Free a defiant house, by our yarligh, of every decree it refused. A tarkhan house is exempt for good: it ends the quarrel today, and that house will never be bound by those decrees."
 ulus_tarkhan_effect_tt: "This house's defiance ends at once. It is #Y exempt for good#! from every decree it refused. We lose #R 8#! authority. If the ulus is ever made one realm, a house holding a charter stays as our subject and is not taken into our own realm."
 cb_enforce_the_decree: "Enforce the Decree"
 cb_enforce_the_decree_desc: "The khān against a house that refused his decree. We need only win the war: the house then obeys every decree standing."
 cb_gather_the_uluses: "Gather the Uluses"
 cb_gather_the_uluses_desc: "The khān who made the Chaghatay one realm, against another horde of the steppe."
 opinion_ulus_decreed_too_far: "Decreed past his strength"
 opinion_ulus_won_over: "Won over with gifts"
 STATIC_MODIFIER_NAME_ulus_decree_darugha_seated_mod: "The Khān's Darugha"
 STATIC_MODIFIER_DESC_ulus_decree_darugha_seated_mod: "The khān's man sits in our towns and counts what is the khān's."
 STATIC_MODIFIER_NAME_ulus_decree_darughas_mod: "Darughas in the Amīrs' Towns"
 STATIC_MODIFIER_DESC_ulus_decree_darughas_mod: "The khān's men sit in the towns of the houses that obey the third decree."
 STATIC_MODIFIER_NAME_ulus_tarkhan_mod: "Tarkhan House"
 STATIC_MODIFIER_DESC_ulus_tarkhan_mod: "By the khān's yarligh this house is free of decrees that bind the others."
 STATIC_MODIFIER_NAME_khan_of_one_ulus_mod: "One Ulus, One Khān"
 STATIC_MODIFIER_DESC_khan_of_one_ulus_mod: "The houses of Chaghatay are one realm again under a khān who rules them."
 khan_authority.1.title: "The Khān's Decree"
 khan_authority.1.desc: "The khān's decree has been read before the houses of the ulus, and it stands. Most of the weight of the ulus has said it will obey. The houses that would not have said so openly, and they know what the khān may now do about it."
 khan_authority.1.a: "It is the khān's word."
 khan_authority_decree_stands_tt: "The decree binds every house that obeyed. Each house that refused is in #Y open defiance#!: the khān holds a casus belli on it and may make war on it inside the ulus. The panel of the ulus lists them."
 khan_authority.2.title: "The Decree Is Refused"
 khan_authority.2.desc: "The khān's decree was read before the houses, and the greater part of the ulus would not have it. It has been withdrawn. Nobody has drawn a sword, but every beg now knows how far the khān's word runs and where it stops."
 khan_authority.2.a: "He reached past his strength."
 khan_authority_decree_failed_tt: "The decree is withdrawn. The khān loses #R 15#! authority, and no decree can be proclaimed for ten years. A weaker khān is easier to rise against: see the bar on the panel of the ulus."
 khan_authority.3.title: "We Bow to the Decree"
 khan_authority.3.desc: "Our defiance is over. Whether by the khān's army, his gifts or the plain arithmetic of the ulus, we have accepted what we refused, and his men are told that this house obeys."
 khan_authority.3.a: "The khān's word, then."
 khan_authority.4.title: "The Khān's Charter"
 khan_authority.4.desc: "The khān's yarligh has come under his red seal. What we refused we are freed of, by name and for good. We are tarkhan: his other houses are bound, and we are not."
 khan_authority.4.a: "Keep the seal where it can be shown."
 khan_authority.5.title: "One Ulus, One Khān"
 khan_authority.5.desc: "There are no more houses to be asked. The begs who commanded tümens by their fathers' right command them now by the khān's appointment, and their pastures are his to give. For the first time since Kebek's day the country of Chaghatay answers to one man, and beyond it lie the other hordes of the steppe, each ruled by a lesser claim than his."
 khan_authority.5.a: "Now for the rest of the inheritance."
 khan_authority_one_ulus_tt: "Ulus Chaghatay is one realm. For thirty years we hold a casus belli, renewed each year, on every other horde we border."
 ULUS_DECREE_OBEYERS: "Would obey the next decree"
 ULUS_DECREE_REFUSERS: "Would refuse the next decree"
 ULUS_DECREE_LISTS_TT: "Each amīr house's answer to the khān's NEXT decree, as the ulus stands today. Hover a house for its reckoning; it obeys at 0 or more."
