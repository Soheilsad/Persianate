l_english:

 # ============================================================
 # THE IMAMATE'S ROAD TO A SULTANATE (zaydi_chancery_events.txt,
 # zaydi_chancery_actions.txt, 07_zaydi_reforms.txt)
 # ============================================================

 # --- stage one: the event ---
 zaydi_chancery.1.t: "The Dīwān of the Lowlands"
 zaydi_chancery.1.d: "The city has fallen and its registers with it: the tax rolls of the wadis, the rawk surveys, the dīwān of the army with its lists of iqtāʿ-holders, and the scribes who kept them, who have not left their desks. They ask, politely, whom they now serve.\n\nThe Imamate has never had such men. The Imām's agents collect zakāt, his qāḍīs judge, the hijras teach; the tribes fight and are not taxed. To keep these scribes is to rule the lowlands as the sultāns ruled them, and the sayyid houses of the north already know what that means."
 zaydi_chancery.1.a: "Let the scribes serve the Imām. Take up the dīwān."
 zaydi_chancery_transform_now_tt: "The imamate already holds the tenet of the Imām's House: #bold the Zaydī Imamate becomes a Persianate Sultanate now#!, under the Rasulid Chancery and the Imām's House."
 zaydi_chancery_holds_diwan_tt: "The Imām #bold holds the dīwān#!. Once the imamate adopts the tenet of the Imām's House, he may #bold Proclaim the Imām's House#!."
 zaydi_chancery.1.b: "The Imām rules by the Book and the sword. Disperse them, and take what is in the treasury."

 # --- the reforms ---
 sultanized_imamate: "The Imām's House"
 sultanized_imamate_desc: "The imamate has become hereditary and the state a sultanate with an Imām at its head. The sworn still answer his call and pay him zakāt; his army is still Ḥāshid and Bakīl; but the jurists have their grievance, and they will remember it for a generation. The Qāsimid state after al-Mutawakkil Ismāʿīl."

 # --- stage two: the action ---
 proclaim_imams_house: "Proclaim the Imām's House"
 proclaim_imams_house_desc: "Make the imamate hereditary and the state a sultanate. Requires a captured dīwān, an heir, and an imamate that has already adopted the tenet of the Imām's House."
 proclaim_imams_house_dynastic_tenet_tt: "Our imamate holds the tenet #bold The Imām's House#!"
 proclaim_imams_house_effect_tt: "The Zaydī Imamate becomes a #bold Persianate Sultanate#! under the #bold Rasulid Chancery#! and #bold The Imām's House#!, succession passes to the favoured son, and the jurists carry #bold the sultanized imamate's grievance#! for 25 years."
 THE_IMAM_IS_OLD: "The Imām is old and has a son"
 proclaim_imams_house_price: "The Imām's House"

 # --- the modifier ---
 STATIC_MODIFIER_NAME_sultanized_imamate_grievance: "The Jurists' Grievance"
 STATIC_MODIFIER_DESC_sultanized_imamate_grievance: "The imamate was made a possession. The scholars who elected imāms for four centuries have not forgotten it."
