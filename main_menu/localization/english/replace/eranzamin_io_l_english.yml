 MODIFIER_TYPE_DESC_eranzamin_sovereign_shah_can_participate_in_parliament: "This allows the [ShowSpecialStatusName('eranzamin_sovereign_shah')] to suggest [parliament_agendas|e] in the [parliament|e] of an [international_organization|e]."
 MODIFIER_TYPE_NAME_eranzamin_sovereign_shah_agenda_impact: "Agenda Impact for $eranzamin_sovereign_shah$"
 MODIFIER_TYPE_DESC_eranzamin_sovereign_shah_agenda_impact: "This modifies the support that the [parliament_agendas|e] that the [ShowSpecialStatusName('eranzamin_sovereign_shah')] group proposes has."
