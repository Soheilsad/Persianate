l_english:
 eranzamin_succession: "The Succession of Erānzamīn"
 eranzamin_succession_desc: "The Ilkhanid throne is empty. Across Erānzamīn — the realm of Iran as the Khans' own chancery named it — rival amirs, viziers, and house-claimants advance to gather what was Hulagu's. The old administrative sinews still bind the provinces, allowing a swift hand to gather them; the same sinews snap loudly when pulled the wrong way."
 STATIC_MODIFIER_NAME_eranzamin_contender_modifier: "Contender for the Throne"
 STATIC_MODIFIER_DESC_eranzamin_contender_modifier: "This nation pursues the throne of Erānzamīn — legitimacy to conquer rival successor-states swiftly, at the cost of constant challenge. As a contender within what is legally one nation, he cannot hope for treaties or partial defeats and victories. For the enemy to enter a province is for them to own it."
 STATIC_MODIFIER_NAME_eranzamin_succession_region_modifier: "Post-Ilkhanid Chaos"
 STATIC_MODIFIER_DESC_eranzamin_succession_region_modifier: "The breakdown of central authority has left the provinces vulnerable but militarized. Years of forced destruction of fortifications by mongols has made defense impossible"
 consolidate_diwan: "Consolidate the Diwan"
 consolidate_diwan_desc: "Extend the bureaucracy into this province. The taxmen, the qadis, and the registers reach all the way in. The Diwan estate prospers; the Amirs grumble about land they will never receive."
 consolidate_diwan_axis_tt: "Realm leans Tāzīk (turk_vs_tazik > 15)"
 consolidate_diwan_central_diwan_tt: "Dīwān al-Mamālik built in the capital"
 consolidate_diwan_select_province: "Select a province to consolidate"
 consolidate_diwan_no_provinces: "No territory-level provinces available to consolidate. Provinces also require a Local Dīwān in one of their locations."

 grant_the_yurt: "Grant the Yurt"
 grant_the_yurt_desc: "Settle the province as iqtaʿ to your amirs — Mongol practice, light hand. The Amirs are rewarded with land they will hold; tax revenue suffers but levies follow."
 grant_the_yurt_axis_tt: "Realm leans Türk (turk_vs_tazik < -15)"
 grant_the_yurt_select_province: "Select a province to grant"
 grant_the_yurt_no_provinces: "No territory-level provinces available to grant."

 mixed_settlement: "Mixed Settlement"
 mixed_settlement_desc: "The Ilkhanid compromise — Mongol amirs garrison the land, Persian secretaries keep the books, nobody is fully satisfied. Smaller gains, no faction pushed."
 mixed_settlement_select_province: "Select a province to settle"
 mixed_settlement_no_provinces: "No territory-level provinces available to settle."

 STATIC_MODIFIER_NAME_consolidate_diwan_mod: "Consolidated Diwan"
 STATIC_MODIFIER_DESC_consolidate_diwan_mod: "The bureaucracy has reached in — taxes flow, courts function, dissent is muted."
 STATIC_MODIFIER_NAME_grant_the_yurt_mod: "Granted as Yurt"
 STATIC_MODIFIER_DESC_grant_the_yurt_mod: "An amir holds this land as iqtaʿ — soldiers ride out of it, but the diwan sees little."
 STATIC_MODIFIER_NAME_mixed_settlement_mod: "Mixed Settlement"
 STATIC_MODIFIER_DESC_mixed_settlement_mod: "The Ilkhanid compromise — neither fully integrated nor fully autonomous."
 STATIC_MODIFIER_NAME_turkic_tribal_settlement_mod: "Türkmen Tribal Settlement"
 STATIC_MODIFIER_DESC_turkic_tribal_settlement_mod: "Türkmen tribesmen and their amirs have recently pitched their tents here. The amir layer lives on horseback, not in the diwan — the literacy of nobles is capped while the settlement remains tribal."
 STATIC_MODIFIER_NAME_diwan_extension_mod: "Diwan Extension"
 STATIC_MODIFIER_DESC_diwan_extension_mod: "The chancery has reached deeper into the realm — new registers compiled, new qadis appointed, new postal chains laid. Tax flows more efficiently and the writ of the capital extends further into the provinces."
 war_goal_eranzamin_succession_wargoal: "Defeat the followers of the enemy claimant and claim the throne of Erānzamīn."
 war_goal_eranzamin_succession_wargoal_desc: "A war to destroy a rival in the field, and conquer his land with or without a treaty."
 cb_eranzamin_succession: "Succession of Erānzamīn"
 cb_eranzamin_succession_desc: "We are a contender for the throne of Erānzamīn, and so is our enemy. Only one claimant can sit on Hulagu's seat — the legitimacy of the Khans does not divide."
 ERANZAMIN_SUCCESSION_WAR_NAME: "$ATTACKER$'s Succession War against $DEFENDER$"
 rally_turkic_tribes: "Rally Turkic Tribes"
 rally_turkic_tribes_desc: "Send the bitikchis out to the ulus — call the Türkmen lineages in to the muster. Tribesmen and their amir layer arrive in the chosen rural location, scaled to the rank of the realm. The diwan, the burghers, and the peasantry are alienated by the influx; the steppe will not be summoned by a court that has gone Tāzīk."
 rally_turkic_tribes_axis_tt: "Realm has not leaned Tāzīk (turk_vs_tazik < 0)"
 restore_persian_bureaucracy_rank_tt: "Realm is at least a Duchy in rank"
 restore_persian_bureaucracy: "Restore Persian Bureaucracy"
 restore_persian_bureaucracy_desc: "Recall the Iranian secretarial class to court — the Juvaynīs, the Rashīds, the Mustawfīs of Qazvīn. The mustawfī al-mamālik resumes his audits; the chancery's idiom becomes state policy. Permanently grants the right to seat the Dīwān al-Mamālik in the capital — the central building gate reads this act, even should the realm later drift back toward the Türk pole. Adds a stacking 25-year Diwan Extension modifier, pushes the realm firmly toward Tāzīk, and pleases the chancery class; the amirs are alienated by the chancery's return."
 press_eranzamin_claim: "Press Claim to Erānzamīn"
 press_eranzamin_claim_desc: "Send heralds to every court that recognizes Hulagu's seat. Declare that our rival's pretension is unsanctioned — and that we will press the matter at sword's point. Grants a Succession casus belli against the chosen contender, bypassing the need for a spy network."
 press_eranzamin_claim_select_country: "Select a contender to claim against"
 press_eranzamin_claim_no_countries: "No contender neighbors are available — we have no contender neighbors who are not already at war, in truce, or allied with us."
 eranzamin_contender_tt: "This nation is a contender for the throne of Erānzamīn."
 ilkhanate_flavor.1.title: "Hulagu's Seat Stands Empty"
 ilkhanate_flavor.1.desc: "Abu Saʿīd is dead, and the line of Hülegü has died with him. Erānzamīn, the realm of Iran as the Khans' own chancery styled it, has no Īlkhān. The amirs of the ulus call for a prince of the steppe; the mustawfīs keep writing, for the registers do not stop; the qāḍīs of the cities ask only whose name is to be read in Friday's khuṭba. Tabriz, Soltāniyya, Baghdad, Iṣfahān: every great seat counts its rivals.\n\nWe are a contender. Before the first muster rides out, the question must be settled: in whose name do we rule? Each answer is a door that closes the others.\n\nThe first is the easy one: rule as our predecessors did. Find a Chinggisid of any line, a half-grown prince, a widowed princess, an infant in arms, and seat him on the throne while we hold the reins. The amirs prefer it, the chancery will draft for it, and the world still honors a Borjigin seal, whoever presses it into the wax.\n\nThe second is the Caliph's road. Seek investiture from the ʿAbbāsid who keeps his title in Cairo under Mamluk protection, and rule as Sulṭān al-Ghuzāt, sword of the faith. The ulema will bless it, and the muḥtasib will walk the bazaar with new authority. But men will ask where this holy war is to be fought. There is no infidel within a month's ride of our gates. The ghazā we proclaim will be waged against Muslims we have first declared bad Muslims: raiders whose Islam is suspect, schismatics, drunkards on thrones. A holy war that must invent its infidels, sanctioned by a caliph who is himself a guest in another man's house.\n\nThe third is the steepest, and the most our own. Claim the farr: the royal fortune of Iran, God's favor made visible in a just king, the kingship the ulema themselves praise in every mirror written for princes. The sultan as the shadow of God upon the earth, heir to Anūshīrvān whose justice even the Prophet's age remembered. The diwan will rejoice, for this is the doctrine of their own books; the bazaars will follow. But the amirs will not bow to a crown that owes nothing to the steppe, and the jurists will ask quietly by what right a man names himself God's shadow when no one living can invest him."
 ilkhanate_flavor.1.a: "Find us a Borjigin to enthrone."
 ilkhanate_flavor.1.b: "We rule as the Caliph's sword on the frontier."
 ilkhanate_flavor.1.c: "The farr of Iran does not descend through Mongol seed."
 ilkhanate_flavor.1.d: "Grandma Dearest shall do nicely as a puppet. Just don't tell her I said that. "
 ilkhanate_flavor.1.e: "The boy will read what the chancery sets in front of him. As boys do."

 ilkhanate_flavor.2.title: "The Khan is Dead"
 ilkhanate_flavor.2.desc: "Our Borjigin has died. The chancery's draftsmen lay down their pens; the herald waits in the antechamber for the name to be read in tomorrow's khuṭba. The choice is ours alone — no Chinggisid prince stands ready to be acclaimed without our hand on his shoulder.\n\nWe may end the fiction. Drop the regent's mask, rule in our own name, and meet what comes: the amirs incensed at the broken contract, the chancery unsure under which star to draft, the realm naked of any doctrine until we settle on one. Or we may continue what we began. The dead khan leaves a son. The seal is recut, the new name read out, and the world is asked to pretend, once more, that a child commands what we already hold. Each turn of this wheel grinds finer than the last."
 ilkhanate_flavor.2.a: "Enough. The mask comes off."
 ilkhanate_flavor.2.b: "Enthrone his son. Or his brother. I do not care. The fiction must hold another generation."

 STATIC_MODIFIER_NAME_charade_continues_mod: "The Charade Continues"
 STATIC_MODIFIER_DESC_charade_continues_mod: "Another Borjigin child has been raised to the throne, and another generation of the realm pretends not to notice whose hand moves the seal. The chancery resents the salaries; the amirs watch infants proclaimed khan; the fiction frays a little further each time it is repaired. The legitimacy of the line of the Khans is not infinite."

 # Borjigin puppet — the courtier-khan spawned by option A.
 name_sulayman_khan: "Sulaymān Khān"
 borjigin_dynasty: "Borjigin"
 ilkhanate_flavor.10.title: "The New Ilkhan"
 ilkhanate_flavor.10.desc_persian: "The long night of the steppe is over. By the grace of God and the strength of our arms, we have reunited the realm. But we do not restore the rule of the Mongol warlords. Instead, we reclaim the ancient title of Shahanshah. The Men of the Pen have triumphed over the Men of the Sword."
 ilkhanate_flavor.10.desc_mongol: "The legacy of Hulagu is secure. Through blood and iron, we have crushed the pretenders and restored the Ilkhanate. The soft ways of the Persians are rejected; the sword of the steppe will rule for another century."
 ilkhanate_flavor.10.a: "Long live the Great Khan!"
 ilkhanate_flavor.10.b: "Long live the Shahanshah!"
 ilkhanate_flavor.99.title: "The Dream Dies"
 ilkhanate_flavor.99.desc: "Decades of war have left the realm broken. No single power has been able to claim the legacy of the Ilkhanate. The dream of unity is dead, replaced by a patchwork of petty tyrants and local warlords."
 ilkhanate_flavor.99.a: "A dark age descends."
 STATIC_MODIFIER_NAME_great_khans_mandate: "Mandate of the Great Khan"
 STATIC_MODIFIER_DESC_great_khans_mandate: "The ruler holds the supreme military authority of the Mongol tradition."
 STATIC_MODIFIER_NAME_restoration_of_eran: "Restoration of Eran"
 STATIC_MODIFIER_DESC_restoration_of_eran: "The ancient Persian empire has been reborn, centered on efficient bureaucracy and high culture."
 STATIC_MODIFIER_NAME_shattered_administration_mod: "Shattered Administration"
 STATIC_MODIFIER_DESC_shattered_administration_mod: "The administrative links that once bound this region have completely collapsed."
 STATIC_MODIFIER_NAME_cloistered_khan: "Puppet Khan"
 STATIC_MODIFIER_DESC_cloistered_khan: "Puppet Khan For Greater Powers"
