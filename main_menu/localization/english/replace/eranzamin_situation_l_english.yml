l_english:
 eranzamin_succession: "The Succession of Ērānzamīn"
 eranzamin_succession_desc: "The Ilkhanid throne is empty. Across Ērānzamīn — the realm of Ērān as the Khāns' own chancery named it — rival amīrs, viziers, and house-claimants advance to gather what was Hülegü's. The old administrative sinews still bind the provinces, allowing a swift hand to gather them; the same sinews snap loudly when pulled the wrong way."
 STATIC_MODIFIER_NAME_eranzamin_contender_modifier: "Contender for the Throne"
 STATIC_MODIFIER_DESC_eranzamin_contender_modifier: "This nation pursues the throne of Ērānzamīn. As a contender within what is legally one nation, it cannot hope for treaties or partial victories.\n\nThe sword rules the succession. While the war continues, any location your armies take by siege inside Ērānzamīn is annexed on the spot, so long as its owner is at war with you and still rules by the sword alone.\n\nA realm that has proven its claim keeps its borders. Land held by a state with the #Y Iranian Kingship#!, #Y Dar al-Jihād#!, #Y Gurkani Regime#!, #Y Crowned Murshid#!, #Y Sultanate of Rūm#! or #Y Timurid Empire#! reform must be taken at the peace table like anywhere else in the world.\n\nThe same rule shields you. Finish your own legitimacy disaster and your conquests become yours in law, taken from you only the slow way."
 STATIC_MODIFIER_NAME_eranzamin_succession_region_modifier: "Post-Ilkhanid Chaos"
 STATIC_MODIFIER_DESC_eranzamin_succession_region_modifier: "The breakdown of central authority has left the provinces vulnerable but militarized. Years of forced destruction of fortifications by mongols has made defense impossible"
 consolidate_diwan: "Consolidate the Dīwān"
 consolidate_diwan_desc: "Extend the bureaucracy into this province. The taxmen, the qāḍīs, and the registers reach all the way in. The Dīwān estate prospers; the Amīrs grumble about land they will never receive."
 consolidate_diwan_axis_tt: "The realm leans Tāzīk (balance above 15)"
 consolidate_diwan_central_diwan_tt: "Dīwān ul-Mamālik built in the capital"
 consolidate_diwan_select_province: "Select a province to consolidate"
 consolidate_diwan_no_provinces: "No [conquered|e] province of Ērānzamīn is available to consolidate. A province also needs a Local Dīwān in one of its locations."
 restore_diwan_tt: "Restoring the Persian Bureaucracy allows hitherto Turk nations to restore the dīwān, unlocking Dīwān of the Realms."
 grant_the_yurt: "Grant the Yurt"
 grant_the_yurt_desc: "Settle the province as iqtāʿ to your amīrs — Mongol practice, light hand. The Amīrs are rewarded with land they will hold; tax revenue suffers but levies follow."
 grant_the_yurt_axis_tt: "The realm leans Turk (balance below −15)"
 grant_the_yurt_select_province: "Select a province to grant"
 grant_the_yurt_no_provinces: "No [conquered|e] province of Ērānzamīn is left to grant."

 mixed_settlement: "Mixed Settlement"
 mixed_settlement_desc: "The Ilkhanid compromise — Mongol amīrs garrison the land, Persian secretaries keep the books, nobody is fully satisfied. Smaller gains, no faction pushed."
 mixed_settlement_select_province: "Select a province to settle"
 mixed_settlement_no_provinces: "No [conquered|e] province of Ērānzamīn is left to settle."

 STATIC_MODIFIER_NAME_consolidate_diwan_mod: "Consolidated Dīwān"
 STATIC_MODIFIER_DESC_consolidate_diwan_mod: "The bureaucracy has reached in — taxes flow, courts function, dissent is muted."
 STATIC_MODIFIER_NAME_grant_the_yurt_mod: "Granted as Yurt"
 STATIC_MODIFIER_DESC_grant_the_yurt_mod: "An amīr holds this land as iqtāʿ — soldiers ride out of it, but the dīwān sees little."
 STATIC_MODIFIER_NAME_mixed_settlement_mod: "Mixed Settlement"
 STATIC_MODIFIER_DESC_mixed_settlement_mod: "The Ilkhanid compromise — neither fully integrated nor fully autonomous."
 STATIC_MODIFIER_NAME_turkic_tribal_settlement_mod: "Türkmen Tribal Settlement"
 STATIC_MODIFIER_DESC_turkic_tribal_settlement_mod: "Türkmen tribesmen and their amīrs have recently pitched their tents here. The amīr layer lives on horseback, not in the dīwān — the literacy of nobles is capped while the settlement remains tribal."
 STATIC_MODIFIER_NAME_diwan_extension_mod: "Dīwān Extension"
 STATIC_MODIFIER_DESC_diwan_extension_mod: "The chancery has reached deeper into the realm — new registers compiled, new qāḍīs appointed, new postal chains laid. Tax flows more efficiently and the writ of the capital extends further into the provinces."
 war_goal_eranzamin_succession_wargoal: "Defeat the followers of the enemy claimant and claim the throne of Ērānzamīn."
 war_goal_eranzamin_succession_wargoal_desc: "A war to destroy a rival in the field, and conquer his land with or without a treaty."
 cb_eranzamin_succession: "Succession of Ērānzamīn"
 cb_eranzamin_succession_desc: "We are a contender for the throne of Ērānzamīn, and so is our enemy. Only one claimant can sit on Hülegü's seat — the legitimacy of the Khāns does not divide."
 cb_ghozva: "Ghazā"
 cb_ghozva_desc: "A holy war declared against enemies of the faith by a Ghāzī"
 cb_unite_iran: "Unite Ērān"
 cb_unite_iran_desc: "Re-establish the Authority of the King of Kings over all of Ērān, as righteousness demands"
 ERANZAMIN_SUCCESSION_WAR_NAME: "The $NUM$$ORDER$ $FIRSTNAME$ Succession War against $SECONDNAME$"
 rally_turkic_tribes: "Rally Turkic Tribes"
 rally_turkic_tribes_desc: "Send the bitikchis out to the ulus — call the Türkmen lineages in to the muster. Tribesmen and their amīr layer arrive in the chosen rural location, scaled to the rank of the realm. The dīwān, the burghers, and the peasantry are alienated by the influx; the steppe will not be summoned by a court that has gone Tāzīk."
 rally_turkic_tribes_axis_tt: "The realm has not leaned Tāzīk (balance below 0)"
 restore_persian_bureaucracy_rank_tt: "Realm is at least an Amirate or Wilāyat in rank"
 restore_persian_bureaucracy_already_tazik_tt: "Not already a Tāzīk realm (Turk–Tāzīk axis below 50) of Kingdom rank or higher: such a realm already holds the right to seat the Dīwān ul-Mamālik"
 restore_persian_bureaucracy: "Restore Persian Bureaucracy"
 restore_persian_bureaucracy_desc: "Recall the Iranian secretarial class to court — the Juwaynīs, the Rashīds, the Mustawfīs of Qazwīn. The mustawfī ul-Mamālik resumes his audits; the chancery's idiom becomes state policy. Permanently grants the right to seat the Dīwān ul-Mamālik in the capital — the central building gate reads this act, even should the realm later drift back toward the Turk pole. Adds a stacking 25-year Dīwān Extension modifier, pushes the realm firmly toward Tāzīk, and pleases the chancery class; the amīrs are alienated by the chancery's return."
 press_eranzamin_claim: "Press Claim to Ērānzamīn"
 press_eranzamin_claim_desc: "Send heralds to every court that recognizes Hülegü's seat. Declare that our rival's pretension is unsanctioned — and that we will press the matter at sword's point. Grants a Succession casus belli against the chosen contender, bypassing the need for a spy network."
 press_eranzamin_claim_select_country: "Select a contender to claim against"
 press_eranzamin_claim_no_countries: "No contender neighbors are available — we have no contender neighbors who are not already at war, in truce, or allied with us."
 eranzamin_contender_tt: "This nation is a contender for the throne of Ērānzamīn."
 ilkhanate_flavor.1.title: "Hülegü's Seat Stands Empty"
 ilkhanate_flavor.1.desc: "Abū Saʿīd is dead, and the line of Hülegü has died with him. Ērānzamīn, the realm of Ērān as the Khāns' own chancery styled it, has no Īlkhān. The amīrs of the ulus call for a prince of the steppe; the mustawfīs keep writing, for the registers do not stop; the qāḍīs of the cities ask only whose name is to be read in Friday's khuṭba. Tabrēz, Soltāniyya, Baghdad, Isfahān: every great seat counts its rivals.\n\nWe are a contender. Before the first muster rides out, the question must be settled: in whose name do we rule? Each answer is a door that closes the others.\n\nThe first is the easy one: rule as our predecessors did. Find a Chinggisid of any line, a half-grown prince, a widowed princess, an infant in arms, and seat him on the throne while we hold the reins. The amīrs prefer it, the chancery will draft for it, and the world still honors a Borjigin seal, whoever presses it into the wax.\n\nThe second is the Caliph's road. Seek investiture from the Abbasid who keeps his title in Cairo under Mamluk protection, and rule as Sultān ul-Ghuzāt, sword of the faith. The ʿulamāʾ will bless it, and the muhtasib will walk the bazaar with new authority. But men will ask where this holy war is to be fought. There is no infidel within a month's ride of our gates. The ghazā we proclaim will be waged against Muslims we have first declared bad Muslims: raiders whose Islam is suspect, schismatics, drunkards on thrones. A holy war that must invent its infidels, sanctioned by a caliph who is himself a guest in another man's house.\n\nThe third is the steepest, and the most our own. Claim the farr: the royal fortune of Ērān, God's favor made visible in a just king, the kingship the ʿulamāʾ themselves praise in every mirror written for princes. The sultān as the shadow of God upon the earth, heir to Anōshīrwān whose justice even the Prophet's age remembered. The dīwān will rejoice, for this is the doctrine of their own books; the bazaars will follow. But the amīrs will not bow to a crown that owes nothing to the steppe, and the jurists will ask quietly by what right a man names himself God's shadow when no one living can invest him.\n\nAnd there is a fourth road, which is no claim at all: to be a governor and not a king. Hold our corner, administer what is ours, read aloud whatever name the strongest sends us, and wait to see who wins. The Injuid keep Fārs so; the Karts keep Herāt so. It wins nothing and risks nothing — and when the dust settles, we may kneel to whoever is left standing, and keep our heads and our registers both."
 ilkhanate_flavor.1.a: "Find us a Borjigin to enthrone."
 ilkhanate_flavor.1.b: "We rule as the Caliph's sword on the frontier."
 ilkhanate_flavor.1.c: "The farr of Ērān does not descend through Mongol seed."
 ilkhanate_flavor.1.d: "Grandma Dearest shall do nicely as a puppet. Just don't tell her I said that. "
 ilkhanate_flavor.1.e: "The boy will read what the chancery sets in front of him. As boys do."
 ilkhanate_flavor.1.f: "We are governors, not kings. Let the others break themselves on the throne."
 ilkhanate_flavor.1.g: "Let them crown whichever mongol animal they please. We hanged the last worthless crowned mongol's tax-farmer; our heads are pledged to the gallows, and our coin bears the Hidden Imām's name alone. No Mongol deserves anything of ours but the same rope we have accepted as the price of our defeat."
 ilkhanate_flavor.1.i: "I am the Khān by right of blood. How dare they stand in my way?"
 ilkhanate_flavor.2.title: "The Khān Is Dead"
 ilkhanate_flavor.2.desc: "Our Borjigin has died. The chancery's draftsmen lay down their pens; the herald waits in the antechamber for the name to be read in tomorrow's khuṭba. The choice is ours alone — no Chinggisid prince stands ready to be acclaimed without our hand on his shoulder.\n\nWe may end the fiction. Drop the regent's mask, rule in our own name, and meet what comes: the amīrs incensed at the broken contract, the chancery unsure under which star to draft, the realm naked of any doctrine until we settle on one. Or we may continue what we began. The dead khān leaves a son. The seal is recut, the new name read out, and the world is asked to pretend, once more, that a child commands what we already hold. Each turn of this wheel grinds finer than the last."
 ilkhanate_flavor.2.a: "Enough. The mask comes off."
 ilkhanate_flavor.2.b: "Enthrone his son. Or his brother. I do not care. The fiction must hold another generation."

 STATIC_MODIFIER_NAME_charade_continues_mod: "The Charade Continues"
 STATIC_MODIFIER_DESC_charade_continues_mod: "Another Borjigin child has been raised to the throne, and another generation of the realm pretends not to notice whose hand moves the seal. The chancery resents the salaries; the amīrs watch infants proclaimed khān; the fiction frays a little further each time it is repaired. The legitimacy of the line of the Khāns is not infinite."

 # Borjigin puppet — the courtier-khan spawned by option A.
 name_sulayman_khan: "Sulaymān Khān"
 borjigin_dynasty: "Borjigin"
 ilkhanate_flavor.10.title: "Fath-nāma — The Proclamation of Victory"
 ilkhanate_flavor.10.desc_persian: "In the name of God, the Merciful, the Compassionate.\n\nA new spring has dawned upon the lands of Ērān, and lo, in this most auspicious year the Humāy of prosperity and fortune has returned to cast its shadow once more upon the throne of the Kayānids. Verily His Imperial Majesty — Shāhanshāh, King of Kings, the Shadow of God upon the earth, the just Sultān-i ghāzī whose justice revives the memory of Anōshīrwān the Just — has gathered the scattered provinces of Ērānzamīn into a single hand.\n\nThe usurpers who seized authority without right are pacified; the rebels who spread corruption upon the earth are brought low. Now the men of the pen take up the registers anew: the ruined cities shall be made to flourish, the qanāts dug out and the caravans set running, that the raʿiyyat — the common people of Ērān — may know peace and plenty. Let the khuṭba be read and the sikka struck in the name of the Shāhanshāh, and let the world be told: Ērān is whole again."
 ilkhanate_flavor.10.desc_mongol: "In the name of God, the Merciful, the Compassionate.\n\nBy the favour of the Eternal Heaven and the strength of the sword, the ulus is gathered once more. His Majesty — Khān of Khāns, Sultān-i ghāzī, lord of the tent and of the throne alike — has crushed the pretenders who dared raise rival banners, and has bound the quarrelling amīrs again beneath a single yarligh.\n\nYet he reigns from Tabrēz as the Īlkhāns reigned before him: the dīwān keeps his registers, the dabīrs draft his decrees, and the chancery proclaims in the high Persian tongue that the Humāy of fortune has alighted again upon these lands. The cities shall be restored and the people made secure — though it is the bow and the swift horse, not the reed-pen alone, that hold Ērān together. Let the khuṭba be read in the Khān's name, from Khurāsān to the gates of the Caucasus."
 ilkhanate_flavor.10.a: "Ērān is whole again."
 ilkhanate_flavor.10.b: "Long live the Shāhanshāh!"
 ilkhanate_flavor.99.title: "The Dream Dies"
 ilkhanate_flavor.99.desc: "Decades of war have left the realm broken. No single power has been able to claim the legacy of the Ilkhanate. The dream of unity is dead, replaced by a patchwork of petty tyrants and local warlords."
 ilkhanate_flavor.99.a: "A dark age descends."
 STATIC_MODIFIER_NAME_great_khans_mandate: "Mandate of the Great Khān"
 STATIC_MODIFIER_DESC_great_khans_mandate: "The ruler holds the supreme military authority of the Mongol tradition."
 STATIC_MODIFIER_NAME_restoration_of_eran: "Restoration of Ērān"
 STATIC_MODIFIER_DESC_restoration_of_eran: "The ancient Persian empire has been reborn, centered on efficient bureaucracy and high culture."
 STATIC_MODIFIER_NAME_shattered_administration_mod: "Shattered Administration"
 STATIC_MODIFIER_DESC_shattered_administration_mod: "The administrative links that once bound this region have completely collapsed."
 STATIC_MODIFIER_NAME_cloistered_khan: "Puppet Khān"
 STATIC_MODIFIER_DESC_cloistered_khan: "A khān kept for the use of stronger men."
 STATIC_MODIFIER_NAME_consolidation_opportunistic_acquisition: "Newly Seized Land"
 STATIC_MODIFIER_DESC_consolidation_opportunistic_acquisition: "We acquired these lands in a moment of our enemies' weakness. Our rule here is not yet fully respected by those within the military elite who didn't support the late Amīr Chupan."
 AUTO_MODIFIER_NAME_unsettled_legitimacy_crisis: "Unsettled Legitimacy"
 AUTO_MODIFIER_NAME_ghazi_lord_at_war: "War for the Faith"
 AUTO_MODIFIER_NAME_ghazi_lord_at_war_yasa: "War on Muslims under the Yasa"
 AUTO_MODIFIER_NAME_ghazi_lord_at_war_lax: "War on Lax Muslims"
 opinion_betrayed_genghis: "Slighted the blood of Chinggis"
 the_refuge_of_religion.tt: "Levies, manpower and legitimacy bonuses while at war with an infidel or heretic."
 opinion_own_khutbah: "Had the sermon read in his own name"

 # --- United Iran victory (ilkhanate_flavor.10) ---
 STATIC_MODIFIER_NAME_united_iran: "United Ērān"
 STATIC_MODIFIER_DESC_united_iran: "The interregnum is over and the realm of Ērān is one again. A reunited empire can hold many peoples and rests on a lawful, settled seat — but the grand imperial court is a costly thing to keep."
 STATIC_MODIFIER_NAME_eranzamin_recovery: "The Recovery"
 STATIC_MODIFIER_DESC_eranzamin_recovery: "The half-century of reconstruction that follows the succession wars. The qanāts are dug out, the caravans run again, and the registers fill: prosperity, food, and development all surge."

 # --- Victory cabinet action: Integrate into the Dīwān (Tāzīk) ---
 integrate_into_diwan: "Integrate into the Dīwān"
 integrate_into_diwan_desc: "The Shāhanshāh's chancery completes the conquest on paper. Where a provincial dīwān office already stands, the cadastre and the qāḍī reach all the way in, integrating the province far faster than the unaided pace."
