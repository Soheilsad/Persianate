l_english:
 # The tümens' raids (generic_actions/amirs_raid_actions.txt)
 ulus_lead_a_raid: "Lead a Raid"
 ulus_lead_a_raid_desc: "Take the tümen across the frontier for what can be driven or carried home: herds, silver, captives, and a payment not to come back. We declare war at once, and the realm we ride against will hold a claim to answer us for five years. Land costs dear in the peace and is not the point. If we win, the spoils come home with us, our men follow us the more readily, and for a time we stand taller in the ulus."
 cb_tumen_raid: "The Tümen's Raid"
 cb_tumen_raid_desc: "A chief of the ulus has brought his riders over the frontier for herds, silver and captives."
 TUMEN_RAID_WAR_NAME: "The $NUM$$ORDER$ $FIRSTNAME$ Raid on $SECONDNAME$"
 ulus_raid_not_our_patron_tt: "This realm is not our patron outside the ulus"
 ulus_raid_ghaza_tt: "They are unbelievers: this is a ghaza. Our men of religion approve (#G +5%#! clergy satisfaction)."
 ulus_raid_no_pretext_tt: "They are of our own faith and we have named no cause against them. We lose #R 10#! prestige and #R 5%#! clergy satisfaction.\n#italic A cause would be that they are our rival, that they back an amir of the ulus, or that they are at war with the seat of the ulus.#!"
 ulus_raid_pretext_tt: "They are of our own faith, but we have a cause against them: it costs us nothing to ride."
 ulus_raid_spoils_tt: "If we win: plunder worth twice their tax base, and their captives to ransom or to sell. We gain #G 5#! horde unity, renown, and #G +2#! weight in the ulus for three years.\nIf we lose: #R 10#! prestige and #R 10#! horde unity."
 amirs_raid.1.title: "The Spoils"
 amirs_raid.1.desc: "The herds are already across the river and the pack-horses are slow with what they carry. Behind them, under guard, come the people: herdsmen who did not run fast enough, craftsmen taken from their benches, the household of a man who thought his walls would hold.\n\nTheir own lord will pay to have them back. The dealers who have ridden out to meet us will pay more."
 amirs_raid.1.desc_muslim: "The herds are already across the river and the pack-horses are slow with what they carry. Behind them, under guard, come the people: herdsmen who did not run fast enough, craftsmen taken from their benches, the household of a man who thought his walls would hold.\n\nThey say the same prayers we do, and the qadi who rode with us has already said what the law is: a free Muslim is not sold. He is ransomed to his own. The dealers who have ridden out to meet us have heard it too, and have raised their price."
 amirs_raid.1.a: "Send to their lord. He may have them for a fair price."
 amirs_raid.1.b: "The dealers pay in coin, today."
 amirs_raid_ransom_tt: "We gain gold worth twice their tax base, paid by the realm we raided."
 amirs_raid_sale_tt: "We gain gold worth three times their tax base. If we and they are both Muslim, we lose #R 10#! prestige and #R 10%#! clergy satisfaction."
 amirs_raid.2.title: "The Raid Fails"
 amirs_raid.2.desc: "They were waiting, or they were quicker than we were told, or the passes were held. The tümen has come home with fewer horses than it took, and the men who followed us for plunder are counting what they have instead."
 amirs_raid.2.a: "Next year the grass will be the same and so will they."
 amirs_raid_lost_tt: "We lose #R 10#! prestige and #R 10#! horde unity."
