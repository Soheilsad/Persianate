 # --- Erānzamīn international organization ---
 eranzamin: "Erānzamīn"
 eranzamin_desc: "The contested inheritance of the Ilkhanid realm — a flat federation of the powers pursuing a single Persianate throne over the lands of Iran. No leader, no fixed claimant, only contenders. Membership eases conquest within the contested region, but the unrest of a realm without a settled sovereign runs high."
