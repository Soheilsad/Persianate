 # =========================================================================
 # Log-fix loc batch — silences the TODO / MISSING keys from the game log.
 #
 # The engine reads a modifier's description from MODIFIER_TYPE_DESC_<x>. The
 # mod's earlier MODIFIER_TYPE_NAME_<x>_desc keys are dead (the engine never
 # reads them), which is why every estate-modifier description fell back to
 # "TODO". The DESC keys below are the correct ones, with text harvested from
 # what the mod already wrote.
 # =========================================================================

 # --- Estate modifier descriptions (Diwan) ---
 MODIFIER_TYPE_DESC_diwan_estate_target_satisfaction: "The equilibrium point towards which Diwan satisfaction trends."
 MODIFIER_TYPE_DESC_global_diwan_estate_power: "Increases the political influence of the Diwan estate."
 MODIFIER_TYPE_DESC_diwan_estate_power: "Local influence of the Diwan."
 MODIFIER_TYPE_DESC_local_diwan_estate_power: "Strength of the Diwan's presence in this location — its scribes, its registers, its qadis."
 MODIFIER_TYPE_DESC_diwan_estate_levy_size: "Contribution of the Diwan to the army levies."
 MODIFIER_TYPE_DESC_diwan_estate_allowed_in_cabinet: "Whether members of the Diwan estate may be seated in the cabinet."
 MODIFIER_TYPE_DESC_diwan_estate_allowed_leading_military: "Whether members of the Diwan estate may be appointed to command the field armies of the realm."
 MODIFIER_TYPE_DESC_monthly_diwan_estate_rebel_growth: "The rate at which discontented members of the Diwan estate generate rebels."
 MODIFIER_TYPE_DESC_diwan_estate_max_tax: "The ceiling on taxes that may be levied on the Diwan estate. Waqf administration, salary carve-outs, and chancery-class exemptions all chip away at this number."

 # --- Estate modifier descriptions (Amirs) ---
