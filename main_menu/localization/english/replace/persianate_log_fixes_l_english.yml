 # The diwan's ultimatum (diwan_vizierate.1)
 diwan_vizierate.1.title: "The Registers Are Closed"
 diwan_vizierate.1.desc: "The mustawfī did not bring the registers to council this month. He brought a petition, sealed by every kātib in the chancery, and read it standing.\n\nThe council, he said, is full of men who cannot read a siyāq cipher: princes, cousins, a brother-in-law. The dīwān is asked to execute what it was not asked to advise, and to find the money for decisions made by men who have never seen a tax roll. It has done so, the petition says, for the last time.\n\nThe terms are simple. The pen will hold the table — a majority of the seats, as in any properly governed realm — or the pen will stop. The registers are closed until the sultān answers. Outside the hall the princes are laughing. Inside it the money is not moving."
 diwan_vizierate.1.a: "The sultān's kin sit where the sultān pleases. Open the registers or lose your hands."
 diwan_vizierate.1.b: "Clear the table. Seat the pen."
 diwan_vizierate_pen_takes_table_tt: "Non-dīwān cabinet members are #bold dismissed#! until the dīwān holds a #bold strict majority#! of seats. Kuttāb of the dīwān estate take every vacated seat — the chancery raises new men of the pen if it has none to spare — and a dīwān man is made #bold head of the cabinet#! if none presides."
 STATIC_MODIFIER_NAME_diwan_spurned_by_the_throne: "The Dīwān Spurned"
 STATIC_MODIFIER_DESC_diwan_spurned_by_the_throne: "The chancery was told, to its face, that the sultān's cousins outrank its registers. For a decade the registers are kept exactly as well as that deserves."

 # The amirs demand iqta (iqta.1)
 iqta.1.title: "The Amīrs Ask for Land"
 iqta.1.desc: "They came to the audience together, which is how you know it was rehearsed: the amīr ul-Umarā and a dozen captains behind him, boots still dusty, standing where the petitioners usually kneel.\n\nThe speech was short. Horsemen are not kept on promises. They are bought, mounted, armored, drilled, and fed, every year, out of someone's revenue — and the treasury's revenue arrives late when it arrives at all. Assign an amīr a parcel's taxes instead — an iqtāʿ, registered and sealed, collected in his name — and he does the sultān's paying for him: the harvest becomes remounts and mail and the retainers' wages, and when the drums sound he arrives with lancers he has already paid. The village owes him its taxes, nothing more. The sultān owes him nothing at all.\n\nThe mustawfī, asked afterward, did not pretend to like it. Every parcel granted is a parcel whose taxes the dīwān will never see again, and the registers will grow thin where the horsemen grow thick. But he was honest about the alternative: lances cost silver, the treasury has little, and the parcels the amīrs are asking for are the ones the chancery's writ barely reaches anyway. Better an amīr who answers the summons than a valley that answers no one."
 iqta.1.a: "Register three grants. Let the horsemen settle, and let them answer the drums."
 iqta.1.b: "The registers stay whole. The amīrs will ride for pay, or they will ride for someone else."
 iqta_grant_three_tt: "Grants the amīrs the #bold iqtāʿ privilege#! if they do not hold it, then registers #bold three iqtāʿ grants#! in rural parcels without one where local control is under 60%. Each grant assigns the parcel's taxes to an amīr, who maintains heavy cavalry out of them: more nobles settle, the levy grows — at the cost of the parcel's rural taxes, which the dīwān never sees again."
 iqta_refuse_tt: "No grants. The amīrs take the refusal as the insult it is; the dīwān notes, approvingly, that the registers remain intact."
 registered_pasture: "Registered Pasture"
 registered_pasture_desc: "The pasture-roads written into the tax registers: flocks counted, routes licensed, the grazing a tenancy of the crown. Fewer horses come off a counted range, and the tribes know exactly what a register is for. Required, one per rural location with over 20,000 tribesmen, to complete the Dissolve program''s third step."
 hosts_cantonment: "Cantonment of the Hosts"
 hosts_cantonment_desc: "The registered hosts trained into the state''s own manpower: drill grounds, pay tables, and officers who answer to the dīwān. What the tribal levy once gave for free, this gives for money, and it stays when the chiefs sulk."
 a_divani_cavalry: "Dīwānī Cavalry"
 a_divani_cavalry_desc: "The register''s cavalry: the same hosts, trained and salaried instead of levied. Drilled where the levy was merely brave."
 STATIC_MODIFIER_NAME_matter_hosts_of_the_state: "Hosts of the State"
 STATIC_MODIFIER_DESC_matter_hosts_of_the_state: "The tribal compact is ended. The free cavalry of the old order is gone with it, and in its place the crown trains, pays and counts its own: the cantonments and the dīwānī cavalry are open."

