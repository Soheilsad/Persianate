 diwan_of_hafiz_desc: "The ghazals of the age's greatest lyric voice, gathered at last into a single dīwān. Every literate court from Rum to Bengal will copy it within a generation."
 safavid_qizilbash_rally_tt: "The Qizilbāsh rally to our banner."
