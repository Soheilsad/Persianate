 # --- Erānzamīn flavor event log entries ---
 eranzamin_flavor.1.entry: "Ḥāfiẓ of Shiraz draws a circle of admirers to his ghazals."
 eranzamin_flavor.2.entry: "Mustawfī presents the Nuzhat al-Qulūb — a register of the whole realm."
 eranzamin_flavor.3.entry: "Dilshād Khātūn, Abū Saʿīd's widow, arrives at our court."
 eranzamin_flavor.11.entry: "The Türkmen confederations move their pastures through the Jazira."
 eranzamin_flavor.12.entry: "An Anatolian beg offers to ride under our banner."

