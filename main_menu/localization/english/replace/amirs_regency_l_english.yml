 SQR_REALM_ADJ: "Gurkani"
 amirs_regency.3.title: "The Amīrs' Regency"
 amirs_regency.3.desc: "The khān is dead, and no son of his rules. [SCOPE.sCountry('ulus_new_regent').GetName] has raised a prince of the line on the white felt and keeps him in its own camp. The summonses to the ulus go out in the khān's name and under that house's seal. The begs who were there say the prince was not asked. Every house in the ulus now has the same two questions to answer: how long this arrangement will hold, and whether it could keep a khān as well as they can."
 amirs_regency.3.a: "We shall see how long he keeps him."
 amirs_regency_begins_tt: "#Y The Amīrs' Regency#! has begun. The keeper of the khān leads the ulus while his standing among the amīrs lasts (the #Y legitimacy gap#! on the ulus panel).\nWe can #Y pledge our tümen#! to a house, or gather pledges ourselves. From the second stage any amīr can #Y claim the khān#! by war."
 opinion_ulus_largesse: "Largesse to the amīrs"
 opinion_ulus_gurkan: "Married into the line"
 opinion_ulus_amirs_fallen_out: "The amīrs have fallen out"
 opinion_ulus_raised_by_him_name: "Raised us to our place"
 ulus_took_his_silver_tt: "We have not taken the regent's largesse within the last two years"
 war_goal_take_the_khan_wargoal: "Take the Ordu"
 war_goal_take_the_khan_wargoal_desc: "The goal is the capital of the house that has the khān: holding it is what wins this war fastest.\n\n#Y We need only win the war.#! Nothing has to be demanded in the peace.\n• A #Y rising against the khān#!, won: the khān is put to death, a prince of the line is raised in our keeping, and the Amīrs' Regency begins with us as regent.\n• A #Y claim on a kept khān#!, in the Amīrs' Regency: whoever takes the keeper's capital takes the khān and the leadership of the ulus with him, at once, without waiting for the peace."
 war_goal_restore_the_ulus_wargoal: "Restore the Ulus"
 war_goal_restore_the_ulus_wargoal_desc: "A war of the line against the house that keeps a khān, or against a realm that was the ulus's. The goal is its capital."
 war_goal_ulus_in_disarray_wargoal: "The Ulus in Disarray"
 war_goal_ulus_in_disarray_wargoal_desc: "A neighbour's war on a khanate whose begs have fallen out. The goal is the keeper's capital; land is cheaper to take than in an ordinary war."
 war_goal_sahib_qiran_submission_wargoal: "The Reckoning"
 war_goal_sahib_qiran_submission_wargoal_desc: "The Sāhib-qirān against a house of the old ulus that would not swear to him. The goal is its capital, and its submission."
 war_goal_tumen_feud_wargoal: "Feud of the Tümens"
 war_goal_tumen_feud_wargoal_desc: "House against house, over who shall keep the khān. Won in the field: beat their riders."
 war_goal_tumen_raid_wargoal: "The Raid"
 war_goal_tumen_raid_wargoal_desc: "Herds, silver and captives. Won in the field and paid in plunder; land costs dear in the peace and is not the point."
 amirs_regency.206.title: "A Prince for the Chaghatay"
 amirs_regency.206.desc: "The beg who kept a khān of the Chaghatay has been beaten, and his camp is ours to order. We are of Chinggis's line, but the ulus of Chaghatay is not ours to sit on: its amīrs will follow a khān of their own country, not a distant throne. So a prince of our house has been raised on the white felt at [SCOPE.sCountry('ulus_invested_seat').GetFlagIconWithNoTooltip] [SCOPE.sCountry('ulus_invested_seat').GetName], and he holds the ulus of us as his share."
 amirs_regency.206.a: "Let him rule them in our name."
 amirs_regency_invested_tt: "The regency ends. A prince of our line rules [SCOPE.sCountry('ulus_invested_seat').GetFlagIconWithNoTooltip] [SCOPE.sCountry('ulus_invested_seat').GetName], which leads the Chaghatay and becomes our subject as an #Y ulus#!. We do not join the ulus ourselves. We gain #G 25#! prestige."
 amirs_regency.207.title: "A Great Khān Sends a Prince"
 amirs_regency.207.desc: "[SCOPE.sCountry('ulus_investor').GetFlagIconWithNoTooltip] [SCOPE.sCountry('ulus_investor').GetName] has beaten the keeper of the khān and raised a prince of its own house on the felt of the ulus. He rules at [SCOPE.sCountry('ulus_invested_seat').GetFlagIconWithNoTooltip] [SCOPE.sCountry('ulus_invested_seat').GetName] and holds the ulus as a share of that throne.\n\nThe regency is over. The amīrs have a khān again, and the khān has a master."
 amirs_regency.207.a: "A khān of the line, and someone else's."
