l_english:
 # =====================================================================
 # The Amirs' Regency — succession in Ulus Chaghatay, the regency and
 # its disaster.
 # Events:  in_game/events/amirs_regency_events.txt
 # Effects: in_game/common/scripted_effects/15_amirs_regency_effects.txt
 # Panel:   in_game/gui/panels/organization/ulus_chaghatay.gui
 # Voice: option text is the speaker's own; descriptions and tooltips
 # are neutral.
 # =====================================================================

 # --- .1 The amirs raise a khan (to the new regent) ---
 amirs_regency.1.title: "The Amīrs Raise a Khān"
 amirs_regency.1.desc: "The khān is dead and the amīrs did not wait for Almaliq to name another. The tümens gathered at our ordu, a prince of the line of Chinggis was brought out, lifted on the white felt and hailed as khān, and when the acclamation was over he was led back to his tent and the amīrs came to ours.\n\nEvery yarligh will go out under his seal. Every one will be written here. The ulus now answers the khān we hold, and through him it answers us."
 amirs_regency.1.a: "He has the name of khān. We have the khān."
 amirs_regency_onset_tt: "Our realm now leads [GetInternationalOrganization('ulus_chaghatay').GetName] as the keeper of its khān. We take the #Y Beglerbeg's Regency#!. The regency lasts only while we keep a khān and keep delivering: watch the legitimacy gap and our heir's standing on the organisation's panel."

 # --- .2 A child khan ---
 amirs_regency.2.title: "A Boy on the Felt"
 amirs_regency.2.desc: "The new khān is a child. The begs are not yet strong enough to set him aside for a khān of their own making, so the realm will be governed in his name until he is grown, as the yasa allows.\n\nBut a boy's reign is the begs' season. Offices are filled without him, pastures are granted without him, and by the time he can ride to war the men who ruled for him will have grown used to it."
 amirs_regency.2.a: "Then let him grow quickly."
 amirs_regency_bar_reduced_tt: "Until a grown khān is seated, the begs need #Y a third less#! weight to raise a khān of their own at the next succession."

 # --- .10 The old seat answers ---
 amirs_regency.10.title: "A Khān Not of Our Making"
 amirs_regency.10.desc: "Word has come from the west. The amīrs have lifted a prince of the line on the felt at one of their own camps and proclaimed him khān of the whole ulus. The beg who holds him writes, with every courtesy, that the tümens of Transoxiana now muster in that khān's name, and that our court is invited to recognise him.\n\nWe may accept it: keep our pastures and our title and sit in the ulus as one house among the others, under a khān who is another man's prisoner. Or we may refuse, take the eastern tümens who are nearer to us than to him, and keep our own khān and our claim to all of it."
 amirs_regency.10.a: "A khān is a khān. We will not break the ulus over which tent he sleeps in."
 amirs_regency.10.b: "A beg's captive is no khān of ours. The east rides with us, and one day the west will answer for this."
 amirs_regency_acquiesce_tt: "We remain in [GetInternationalOrganization('ulus_chaghatay').GetName] as an #Y Amīr of the Ulus#! under the amīrs' khān. Tributary dynasties nearer the regent than to us pass to him."
 amirs_regency_defy_tt: "We leave [GetInternationalOrganization('ulus_chaghatay').GetName]. Every member whose seat lies nearer our capital than the regent's follows us as our vassal. We become the #Y eastern khanate#!, with a standing claim to restore the ulus."

 # --- .12 A player amir nearer Almaliq ---
 amirs_regency.12.title: "Two Khāns"
 amirs_regency.12.desc: "The khān at Almaliq has refused the khān the western amīrs raised, and has ridden out of the ulus with his claim intact. Our pastures lie nearer his court than the regent's. His envoys are in our camp, and so are the regent's."
 amirs_regency.12.a: "We know which of them is a khān and which is a hostage. We ride east."
 amirs_regency.12.b: "Almaliq is far and the beg's tümens are near. We stay."
 amirs_regency_follow_east_tt: "We leave [GetInternationalOrganization('ulus_chaghatay').GetName] and become a vassal of the eastern khān."

 # --- .30 The puppet khan is dead ---
 amirs_regency.30.title: "The Khān Is Dead"
 amirs_regency.30.desc: "The khān in whose name we govern has died. His seal is in our keeping, his household eats at our expense, and none of that is worth anything without a living man of the line to put it to.\n\nThe amīrs are watching what we do next. Each time a khān is buried and another brought out, fewer of them pretend not to notice who chooses."
 amirs_regency.30.a: "Find another of the blood. There is always another."
 amirs_regency.30.b: "My daughter's son carries the blood of Chinggis. Lift him on the felt."
 amirs_regency.30.c: "The tümens follow me, not a boy in a tent. There will be no khān."
 amirs_regency_enthrone_tt: "A living prince of the line is taken into our keeping and proclaimed khān. Every funeral makes the fiction thinner: the regency moves closer to its next stage."
 amirs_regency_enthrone_inlaw_tt: "A child of our own in-law line is proclaimed khān. Our ruler stands as #Y güregen#!, son-in-law of the line, which the last stage of the regency requires."
 amirs_regency_no_khan_tt: "We rule without a khān. The legitimacy gap is #R halved at once#! and drains #R twice as fast#!; the regency moves sharply toward its next stage. Only a regent whose victories already speak for him survives this."

 # --- .41 / .42 / .43 The regent's death ---
 amirs_regency.41.title: "The Khān Stays"
 amirs_regency.41.desc: "The old beg is dead and the amīrs came to the funeral with their men behind them. They looked at his heir, and at each other, and at the khān's tent, and in the end they kissed the heir's stirrup. He is not the man his father was. He is near enough, and none of them was sure of beating him."
 amirs_regency.41.a: "My father held the khān. So do I."
 amirs_regency.42.title: "The Khān Comes to Us"
 amirs_regency.42.desc: "The house that held the khān could not keep him. The amīrs measured its new head and found him short, and the khān's household has been escorted to our ordu with his seal, his wives and his guards. From today the yarlighs are written here, and the ulus answers us."
 amirs_regency.42.a: "Pitch the khān's tent beside mine, and set my guards around it."
 amirs_regency.43.title: "The Khān Is Taken from Us"
 amirs_regency.43.desc: "Our father held the khān and ruled the ulus. We inherited his tümens and his pastures, and we believed we had inherited the rest. The amīrs thought otherwise. A stronger house has taken the khān into its own keeping, and the ulus has gone with him."
 amirs_regency.43.a: "They were my father's dogs. I will have the khān back and their heads with him."
 amirs_regency_lost_khan_tt: "We keep our own state and lose the regency. We hold a claim to take the khān back by war."

 # --- .45 The regent is murdered ---
 amirs_regency.45.title: "The Beg Is Murdered"
 amirs_regency.45.desc: "He rode out to hunt with a few companions and no guard, as he had a hundred times. A kinsman of an amīr he had slighted was among the party. By the time the news reached the ordu the killers were across the river, and every amīr in the ulus had begun to count his men."
 amirs_regency.45.a: "Bury him. Then find out who is riding toward the khān's tent."

 # --- .50 / .51 / .52 An amir house's succession ---
 amirs_regency.50.title: "An Amīr's Succession"
 amirs_regency.50.desc: "The head of one of the tümens of the ulus has died, and his house has already raised its own heir. By the custom of the ulus the succession waits on our word: the command of a tümen is confirmed by the khān's yarligh.\n\nWe may confirm the heir the house has chosen. Or we may set another man of the same house over it, one who will owe his place to us."
 amirs_regency.50.a: "The son holds what the father held. Send him the yarligh and a robe."
 amirs_regency.50.b: "That tümen is the khān's to give. It goes to the kinsman I name."
 amirs_regency_impose_tt: "The house's ruler is replaced by a kinsman of our choosing."
 amirs_regency_may_refuse_tt: "The amīrs have fallen out: the house may accept the kinsman, or #R refuse him and take up arms#! against us."
 amirs_regency.51.title: "A Kinsman Set Over Us"
 amirs_regency.51.desc: "A yarligh has come from the seat of the ulus. It does not confirm the heir our house raised. It names another of our own blood to lead the tümen, and he rode in behind it with an escort."
 amirs_regency.51.a: "He has the yarligh. We will remember who wrote it."
 amirs_regency.52.title: "The House Refuses"
 amirs_regency.52.desc: "The kinsman we named was turned back at the edge of the tümen's pastures. The house keeps the heir it raised and has sent our yarligh back unopened, with word that it will answer to a khān and not to his keeper."
 amirs_regency.52.a: "Then they have chosen war."

 # --- Casus belli ---
 cb_restore_the_ulus: "Restore the Ulus"
 cb_restore_the_ulus_desc: "A khān of the line against the beg who rules the ulus through a khān of his own making."
 RESTORE_THE_ULUS_WAR_NAME: "The $NUM$$ORDER$ $FIRSTNAME$ War to Restore the Ulus"
 cb_take_the_khan: "Take the Khān"
 cb_take_the_khan_desc: "An amīr of the ulus against the amīr who holds the khān. Whoever takes the regent's ordu takes the khān."
 TAKE_THE_KHAN_WAR_NAME: "The $NUM$$ORDER$ $FIRSTNAME$ War for the Khān"

 # --- Opinion ---
 opinion_ulus_heir_confirmed: "Confirmed our succession"
 opinion_ulus_kinsman_imposed: "Set a kinsman over our house"
 opinion_ulus_two_khans: "Two khāns of one ulus"

 # --- Panel: the Succession card during a regency ---
 ULUS_REGENT_LABEL: "Regent:"
 ULUS_REGENT_TT: "The beg who holds the khān. His state leads the ulus for as long as he keeps a khān and keeps the amīrs behind him."
 ULUS_HELD_KHAN_LABEL: "Holds the khān:"
 ULUS_HELD_KHAN_TT: "The prince of the line in whose name the regent rules, and his age. A grown and capable khān may one day try to rid himself of his keeper. If the khān dies the regent must find another, or rule without one."
 ULUS_NO_HELD_KHAN: "He rules without a khān."
 ULUS_HEIR_BAR: "Regent's heir against the best rival"
 ULUS_HEIR_BAR_TT: "When the regent dies, his heir inherits the state but not the khān. The amīrs are polled: the heir keeps the regency only if his standing is at least the share shown of the strongest rival amīr's. Otherwise that rival takes the khān and the ulus."
 ULUS_GAP_LABEL: "Legitimacy gap filled"
 ULUS_GAP_DRAIN_LABEL: "Draining each month"
 ULUS_GAP_OUTWEIGHED: "An amīr outweighs the regent: the gap drains half as fast again."
 ULUS_GAP_TT: "A beg has no blood to rule by, only deeds.\n\n#Y It drains#! every month: 0.15 in the first stage, 0.30 in the second, 0.45 in the third, 0.60 in the last; twice as fast with no khān in keeping; half as fast again while any amīr outweighs the regent.\n\n#Y It is filled#! by the regent's deeds: a great battle won #G +4#!, a siege won #G +2#!, a war won #G +10#! (a raid counts), largesse to the amīrs #G +10#!. A war lost costs #R 15#!.\n\n Kept at 60 or more for five years running in the last stage, with a khān in keeping and a wife of the line, it makes the regent #Y Sāhib-qirān#!. Left empty for three years, the ulus breaks apart."
 ULUS_GAP_FILLED_MONTHS: "Months filled:"
 ULUS_GAP_EMPTY_MONTHS: "Months empty:"
 ULUS_STAGE_PROGRESS: "Toward the next stage"
 ULUS_STAGE_1: "I. The Beglerbeg's Peace"
 ULUS_STAGE_1_TT: "One beg rules through a khān and the amīrs are content. Next: #Y The Amīrs Fall Out#!, when members of the ulus may make war on one another and an amīr house may refuse a kinsman set over it."
 ULUS_STAGE_2: "II. The Amīrs Fall Out"
 ULUS_STAGE_2_TT: "The amīrs may make war on one another, and a house may refuse an imposed kinsman. Next: #Y The Shock from Outside#!, when outsiders gain a claim on the ulus, members may leave it, and whoever takes the regent's capital takes the khān."
 ULUS_STAGE_3: "III. The Shock from Outside"
 ULUS_STAGE_3_TT: "Outsiders hold a claim on the fractured ulus, members may leave it, and a member who takes the regent's capital captures the khān and the leadership. Next: #Y The Sāhib-qirān#!."
 ULUS_STAGE_4: "IV. The Sāhib-qirān"
 ULUS_STAGE_4_TT: "The beg rules in his own right behind his khān. If he holds the khān, has a wife of the line, and keeps the legitimacy gap filled for five years running, the ulus becomes his realm. If the gap lies empty for three years, it dissolves."

 # =====================================================================
 # The disaster (in_game/common/disasters/05_amirs_regency.txt)
 # =====================================================================
 amirs_regency: "The Amīrs' Regency"
 amirs_regency_desc: "A beg rules the ulus through a khān he keeps in his own camp. The amīrs follow him while he delivers, and no longer. Left to itself the arrangement runs through four stages in about a generation: the beglerbeg's peace, the amīrs falling out, the shock from outside, and at last a beg who rules in his own right as Sāhib-qirān, or nobody ruling at all.\n\nThe stage, the legitimacy gap and the regent's heir are shown on the panel of [GetInternationalOrganization('ulus_chaghatay').GetName]; the actions are there as well."
 amirs_regency_end_tt: "Ends when this realm no longer holds the khān of the ulus."
 AMIRS_REGENCY_STAGE_TRACK: "The Stage of the Regency"
 AMIRS_REGENCY_PANEL_POINTER: "The regent's own actions are here: #Y Recall the Darughas#!, #Y Marry into the Line#! and #Y Distribute Largesse#!. What the houses do to each other (pledges, claiming the khān, raids) is on the panel of #Y Ulus Chaghatay#!."
 AMIRS_REGENCY_PROGRESS_TT: "Rises each month while the begs stay over the bar, and at the death of a khān or a regent, a lost war, or ruling without a khān. At 100 the regency passes to its next stage."

 # --- Stages ---
 amirs_regency.100.title: "The Amīrs Fall Out"
 amirs_regency.100.desc: "The peace is over. No beg now stands so far above the others that they fear to cross him, and the tümens that mustered together under one tug are raiding one another's herds. One amīr holds Kesh, another Khujand, another the south, and each speaks of the khān's will as though the khān had sent him.\n\nThe khān is in our tent. That is now a reason for the others to come and take him."
 amirs_regency.100.a: "Let them try the door of this tent."
 amirs_regency_stage_2_tt: "#Y The Amīrs Fall Out.#! Members of the ulus may now make war on one another, and an amīr may claim the khān from us. A house may refuse a kinsman set over it."
 amirs_regency.110.title: "The Shock from Outside"
 amirs_regency.110.desc: "An ulus whose amīrs fight each other is an open pasture. Riders have crossed the frontier in force, and they are not raiders: they come with a claim, and some of our own amīrs have gone out to meet them with gifts.\n\nEvery beg in the ulus is now deciding whether to resist, to submit, or to make himself useful to the invader and be left holding something when he goes home."
 amirs_regency.110.a: "The amīrs who ride with me now will be remembered. So will the others."
 amirs_regency_stage_3_tt: "#Y The Shock from Outside.#! Our strongest neighbours hold a claim on the ulus for ten years. Members may leave it. Whoever takes our capital in war takes the khān, and the leadership with him."
 amirs_regency.121.title: "The Lord of the Conjunction"
 amirs_regency.121.desc: "The wars have sorted the amīrs. Those who rode against us are dead, fled or in our service, and the rest no longer speak of the beg as first among them. They call him what the astrologers called the great conquerors: Sāhib-qirān, born under the conjunction of the two fortunate planets.\n\nHe is still not khān and cannot be. The khān stays in his tent and the yarlighs go out in his name. But the tümens know whose victories feed them, and they will go on knowing it for exactly as long as the victories continue."
 amirs_regency.121.a: "The khān reigns. I conquer. Let no one confuse the two."
 amirs_regency_stage_4_tt: "#Y The Sāhib-qirān.#! Hold the khān, take a wife of the line, and keep the legitimacy gap filled for five years running, and the ulus becomes our realm. Let the gap lie empty for three years, and it dissolves."
 amirs_regency.130.title: "The Khān Is Ours"
 amirs_regency.130.desc: "The regent's ordu has fallen. His guards were found dead around the khān's tent and the khān inside it, unharmed, waiting to learn whose prisoner he was. He has been brought to our camp with his seal and his household, and the first yarligh written here has already gone out."
 amirs_regency.130.a: "Treat him as a khān. Guard him as a treasure."

 # --- Endings ---
 amirs_regency.200.title: "The Khān Triumphant"
 amirs_regency.200.desc: "The khān was meant to sit in his tent and seal what was put before him. He has done otherwise. With men and silver sent to him in secret he struck in a single night: the beg and the grown men of his house were killed at a feast, their commanders were offered the choice of the khān's stirrup or the same, and by morning the tümens were swearing to a khān who rules.\n\nThe realm that kept a khān is now the khān's own."
 amirs_regency.200.a: "There is one khān, and he has no keeper."
 amirs_regency_khan_triumphant_tt: "The khān becomes our ruler. The #Y Beglerbeg's Regency#! ends, and for twenty years the crown's power is greater and the begs' less. The begs cannot raise another khān for fifteen years."
 amirs_regency.201.title: "The Khān's Hand Is Stayed"
 amirs_regency.201.desc: "The khān tried to rid himself of us. He had found friends among the amīrs and silver from somewhere, and on the appointed night his men came for our tents. They were expected. Those who were not killed have named the others.\n\nThe amīrs who had no part in it have drawn their own conclusion: a khān with a will of his own is a danger to every one of them."
 amirs_regency.201.a: "A khān who bites the hand is still a khān. For now."
 amirs_regency_purge_failed_tt: "The regency moves on to its next stage. The khān will most likely be put to death, and another must then be found."
 amirs_regency.205.title: "One Khān Again"
 amirs_regency.205.desc: "The beg who ruled the ulus through a captive has been beaten in the field. His amīrs came into our camp one after another to kiss the stirrup, each explaining that he had never truly accepted the other khān. The tümens of the west muster again in the name of a khān who commands them."
 amirs_regency.205.a: "They served a servant. Now they will learn to serve a khān."
 amirs_regency_khan_triumphant_war_tt: "Our realm leads [GetInternationalOrganization('ulus_chaghatay').GetName] again; the members who followed us east return to it. The regency ends, and for twenty years the crown's power is greater and the begs' less."
 amirs_regency.210.title: "Sāhib-qirān"
 amirs_regency.210.desc: "The amīrs of the ulus have come to the quriltai, and this time there is nothing to decide. For five years every campaign has ended in plunder and every tümen has had its share. The khān sits on the felt; beside him, a step lower, sits his son-in-law, and it is to the son-in-law that the amīrs swear, one by one, laying their belts across their necks.\n\nNot all of them have come. Those who stayed away will be visited."
 amirs_regency.210.a: "I am the khān's servant and his son-in-law. The world may judge what that servant can do."
 amirs_regency_sahib_qiran_tt: "The ulus becomes our realm. Members who think well of us become our vassals; against the rest we hold a claim to their submission for twenty years. [GetInternationalOrganization('ulus_chaghatay').GetName] is dissolved. We take the regime of the #Y Güregen of the Ulus#!.\n\nOur realm rides out as a new conquering state under its Sāhib-qirān and the #Y Rise of Temür#! begins for him."
 amirs_regency.220.title: "Bulqaq"
 amirs_regency.220.desc: "The amīrs no longer come when summoned and no longer send excuses. The khān's name is still read, where anyone troubles to read it, and it commands nothing. Each tümen keeps its own pastures, makes its own wars and answers to no one.\n\nThe old men have a word for a time like this: bulqaq, the great trouble. The ulus of Chaghatay is a memory that several ambitious men are now free to claim."
 amirs_regency.220.a: "I held it as long as it could be held."
 amirs_regency_bulqaq_tt: "[GetInternationalOrganization('ulus_chaghatay').GetName] is dissolved. Every member stands alone. We lose the #Y Beglerbeg's Regency#!. A khān in the east, if there is one, keeps his claim on each of us."

 # --- Actions ---
 ulus_recall_darughas: "Recall the Darughas"
 ulus_recall_darughas_desc: "Call the appointed governors back to the ordu. For ten years the nobles hold less power in our realm, and they resent it. During a regency it also sets the regency's clock back."
 ulus_marry_into_the_line: "Marry into the Line"
 ulus_marry_into_the_line_desc: "Take a woman of the khān's house to wife and stand as güregen, son-in-law of the line of Chinggis. It sets the regency's clock back, it is required of a Sāhib-qirān, and it lets our house raise a khān of its own daughter's blood if the khān we hold should die."
 ulus_not_yet_gurkan_tt: "Our ruler is not already a son-in-law of the line"
 ulus_holds_a_khan_tt: "We hold a living khān"
 ulus_distribute_largesse: "Distribute Largesse"
 ulus_distribute_largesse_desc: "Open the treasury to the amīrs: robes, horses and silver. A year's income fills part of the legitimacy gap."
 ulus_claim_the_khan: "Claim the Khān"
 ulus_claim_the_khan_desc: "Declare before the amīrs that the khān is ill kept and would be better kept by us. We gain a casus belli on the regent for ten years; whoever takes his capital takes the khān."
 ulus_amirs_fallen_out_tt: "The regency has reached its second stage, #Y The Amīrs Fall Out#!"
 ulus_back_the_khan: "Back the Khān's Purge"
 ulus_back_the_khan_desc: "Send men and silver in secret to the khān in the regent's tent. If he succeeds he kills the regent's house and rules as a true khān. If he fails the regency hardens, and he will most likely die for it. The odds are three in ten, or even if he is a proven soldier."
 ulus_khan_can_purge_tt: "The khān the regent holds is a grown man with a soldier's skill (military 50 or more)"

 # --- Casus belli ---
 cb_ulus_in_disarray: "The Ulus in Disarray"
 cb_ulus_in_disarray_desc: "The ulus is ruled by a beg whose own amīrs make war on him. Its pastures are there for the taking."
 ULUS_IN_DISARRAY_WAR_NAME: "The $NUM$$ORDER$ $FIRSTNAME$ Invasion of the Ulus"
 cb_sahib_qiran_submission: "The Sāhib-qirān's Reckoning"
 cb_sahib_qiran_submission_desc: "This amīr did not come to swear when the ulus became one man's realm."
 SAHIB_QIRAN_SUBMISSION_WAR_NAME: "The $NUM$$ORDER$ $FIRSTNAME$ Reckoning with $SECONDNAME$"

 # --- Modifiers ---
 STATIC_MODIFIER_NAME_amirs_regency_strain: "The Regency Under Strain"
 STATIC_MODIFIER_DESC_amirs_regency_strain: "The further the Amīrs' Regency runs, the less of the ulus a regent's summons reaches. Grows with each stage."
 STATIC_MODIFIER_NAME_khan_triumphant_mod: "The Khān Triumphant"
 STATIC_MODIFIER_DESC_khan_triumphant_mod: "A khān of the line has broken the begs' hold on the ulus."
 STATIC_MODIFIER_NAME_ulus_darughas_recalled_mod: "Darughas Recalled"
 STATIC_MODIFIER_DESC_ulus_darughas_recalled_mod: "The appointed governors have been called back to the ordu."
 STATIC_MODIFIER_NAME_sahib_qiran_ascendant_mod: "Lord of the Conjunction"
 STATIC_MODIFIER_DESC_sahib_qiran_ascendant_mod: "The tümens that swore at the quriltai follow the man whose victories feed them."

 # --- The Ṣāḥib-qirān's regime (government_reforms/08_ulus_chaghatay_reforms.txt) ---
 gurkan_of_the_ulus: "Güregen of the Ulus"
 gurkan_of_the_ulus_desc: "He is amīr and son-in-law of the line, and he is careful never to be called more. A khān of the blood of Chinggis sits on the felt and seals the yarlighs; the güregen commands the tümens, divides the plunder and decides everything else. Temür ruled so from 1370 to his death, and never took the title of khān."

