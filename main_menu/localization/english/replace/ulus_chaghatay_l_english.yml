l_english:
 # =====================================================================
 # Ulus Chaghatay — the organisation, its standing, the qubchur, the
 # four domains carved from the khan's share, and the panel.
 # IO:     in_game/common/international_organizations/ulus_chaghatay.txt
 # Panel:  in_game/gui/panels/organization/ulus_chaghatay.gui
 # Ledger: in_game/common/scripted_effects/14_ulus_chaghatay_effects.txt
 # =====================================================================

 # --- The organisation ---
 ulus_chaghatay: "Ulus Chaghatay"
 ulus_chaghatay_desc: "The people and pastures Chinggis Khan gave his second son, from the Altai to the Amu Darya. The khan holds court at Almaliq; under him the tümens hold their hereditary domains: the Barlas at Kesh, the Jalayir at Khujand, the Suldus at Balkh, the Qara'unas in the Afghan lands, the Dughlats at Kashgar. They are not provinces and they are not foreign kings. They ride when the khan rides, they do not make war on him or on one another, and they send him the qubchur.\n\nThe khan's seat is the organisation's leader. It need not stay where it is."
 ULUS_CHAGHATAY_KHAN: "Khan"
 ULUS_CHAGHATAY_KHAN_MALE: "Khan"
 ULUS_CHAGHATAY_KHAN_FEMALE: "Khatun"
 io_opinion_ulus_chaghatay: "Of the same ulus"
 io_trust_ulus_chaghatay: "Of the same ulus"
 diplomatic_status_ulus_chaghatay_name: "Of Ulus Chaghatay"
 diplomatic_status_ulus_chaghatay_tooltip: "This realm belongs to the Chagatai ulus: the khan's own seat, or one of the amir domains that answer it."
 ulus_chaghatay_list_who_tt: "The khan and the amirs of Ulus Chaghatay:"

 # --- Junior standing (Members tab group) ---
 ulus_amir: "Amir of the Ulus"
 ulus_amir_plural: "Amirs of the Ulus"
 ulus_amir_desc: "The head of a tümen holding a hereditary domain inside the ulus. He answers the khan's summons to war, may not take the field against the khan or a fellow amir, and sends the qubchur. His house keeps its own succession."
 MODIFIER_TYPE_NAME_ulus_amir_can_participate_in_parliament: "$ulus_amir$ in Parliament"
 MODIFIER_TYPE_DESC_ulus_amir_can_participate_in_parliament: "This allows the [ShowSpecialStatusName('ulus_amir')] to suggest [parliament_agendas|e] in the [parliament|e] of an [international_organization|e]."
 MODIFIER_TYPE_NAME_ulus_amir_agenda_impact: "Agenda Impact for $ulus_amir$"
 MODIFIER_TYPE_DESC_ulus_amir_agenda_impact: "This modifies the support that the [parliament_agendas|e] that the [ShowSpecialStatusName('ulus_amir')] group proposes has."

 # --- The qubchur ---
 ulus_chaghatay_qubchur: "Qubchur for the Khan"
 ulus_chaghatay_qubchur_desc: "The khan's share: one part in a hundred of each amir's income, sent to the seat of the ulus. It is a light levy. What the khan truly has of his amirs is their horsemen."
 ULUS_CHAGHATAY_QUBCHUR_PAYMENT_MULTIPLIER: "5% of the amirs' [monthly_income_trade_and_tax|e]"
 ulus_chaghatay_qubchur_price: "Qubchur"
 MODIFIER_TYPE_NAME_ulus_chaghatay_qubchur_price_cost_modifier: "$ulus_chaghatay_qubchur_price$"
 MODIFIER_TYPE_DESC_ulus_chaghatay_qubchur_price_cost_modifier: "This impacts the [cost|e] of the qubchur the amirs of [GetInternationalOrganization('ulus_chaghatay').GetName] send to the khan."

 # --- IO variables (header strip) ---
 ulus_amir_count: "Amirs"
 ulus_amir_count_desc: "The junior members of the ulus: every member that is not the khan's seat."
 ulus_beg_power: "Weight of the Begs"
 ulus_beg_power_desc: "The power of the nobles' estate (the begs) in the khan's own realm. When the throne next falls vacant, the begs can raise a khan of their own if they hold at least half the power and at least twice the crown's."
 ulus_amir_ratio: "Great Amirs to Khan"
 ulus_amir_ratio_desc: "The combined weight of the three greatest amirs against the khan's own. A realm's weight is half its military strength, a third its tax base and the rest its prestige; empty land counts for nothing. Near 1.00 the khan is their match; at the line shown on the panel they can raise a khan of their own."
 ULUS_COUNT_FORMAT: "$VAL|0$"
 ULUS_PERCENT_FORMAT: "$VAL|0$%"
 ULUS_RATIO_FORMAT: "$VAL|2$"

 # --- The four domains carved from the khan's share ---
 FGN: "Ulus of Fergana"
 FGN_ADJ: "Ferganan"
 CAC: "Ulus of Chach"
 CAC_ADJ: "Chachi"
 ISQ: "Ulus of Issyk-Kul"
 ISQ_ADJ: "Issyk-Kul"
 DZG: "Ulus of Dzungaria"
 DZG_ADJ: "Dzungarian"

 # --- The beglerbeg's regency (government_reforms/08_ulus_chaghatay_reforms.txt) ---
 beglerbeg_regency: "Beglerbeg's Regency"
 beglerbeg_regency_desc: "The khan sits on the felt and the beg commands the ordu. Every yarlıq goes out under the khan's seal and every tümen musters in his name, because it would not muster in the beg's: a man without the blood of Chinggis cannot be khan, so he keeps one. Qazaghan ruled the ulus this way through two khans, and Mamai and Edigü ruled the house of Jochi so."

 # --- Panel: Overview cards (gui/panels/organization/ulus_chaghatay.gui) ---
 ULUS_KHAN_CARD: "The Khan"
 ULUS_KHAN_CARD_TT: "The seat of the ulus and the man who holds it. The heir is the one the seat's own law of succession names today; whether the amirs let him sit is another matter."
 ULUS_HEIR_LABEL: "Heir:"
 ULUS_NO_HEIR: "No heir stands ready."
 ULUS_SUCCESSION_CARD: "The Succession"
 ULUS_BEG_BAR: "Power of the begs (nobles' estate)"
 ULUS_BEG_BAR_TT: "The begs are the nobles' estate of the khan's own realm: the estate the darugha seats feed. The rule has two parts, and both must hold when the throne falls vacant: the begs hold at least the share shown (half, or a third less after a child khan's reign), #Y and#! at least twice the crown's power. The second row shows the crown's power and what twice it comes to."
 ULUS_AMIR_BAR: "The three greatest amirs against the khan"
 ULUS_AMIR_BAR_TT: "The three amirs with the greatest weight, listed below, and their weights added together against the khan's own. If the throne falls vacant while the result is at or over the line, they raise a khan of their own. These are the three heaviest realms; the amirs likeliest to take the khan are ranked separately, further down."
 ULUS_IF_KHAN_DIED: "Standing in the ulus"
 ULUS_KINGMAKER_TT: "The khan and the three amirs best placed to take a khan into their keeping, ranked by #Y kingmaker score#!. The ranking is for reading: what decides a succession is the two bars above, and the line under the list says what they come to today. The score is: the realm's weight as a share of all the amirs' weight × 400, plus the ruler's military skill × 0.5, plus his administrative skill × 0.2, plus his renown from battles and sieges won during a regency (to a limit of 60). An amir adds 25 for a wife of the line of Chinggis; the khan adds 50 for being of the line himself."
 ULUS_NO_KINGMAKERS: "The roll is drawn up at the turn of each month."
 ULUS_AMIRS_CARD: "The Amirs"
 ULUS_AMIRS_CARD_TT: "Every amir of the ulus, heaviest first: his weight (out of 100 across the whole ulus, khan included) and his share of the amirs' combined weight."
 ULUS_NO_AMIRS: "The khan has no amirs."

 ULUS_CROWN_ROW: "Power of the crown"
 ULUS_KHAN_WEIGHT: "Weight of the khan"
 ULUS_KHAN_WEIGHT_TT: "The khan's own realm on the scale every member of the ulus is weighed on. Each member's [military_strength|e], tax base and prestige are taken as its share of the whole ulus's total, khan included; half the weight comes from the first (out of 50), about a third from the second (out of 35) and the rest from the third (out of 15). All members' weights together make 100."
 ULUS_WEIGHT_MIL: "strength"
 ULUS_WEIGHT_TAX: "tax"
 ULUS_WEIGHT_PRE: "prestige"
 ULUS_GREATEST_AMIR_TT: "One of the three heaviest amir realms, with its weight (out of 100 across the whole ulus). The three weights are summed for the bar above."
 ULUS_AGAINST: "against"
 ULUS_SCORE_HEADER: "kingmaker score"
 ULUS_SEAT_ROW_TT: "The khan's own seat, scored as his amirs are."
 ULUS_HEIR_HOLDS: "If the khan died today, his heir would succeed."
 ULUS_AMIRS_WOULD_RISE: "If the khan died today, the amirs would raise a khan of their own."
 ULUS_OUTCOME_TT: "Decided by the two bars above, not by the ranking: the begs' power in the khan's own realm, and the three greatest amirs against the khan. Either one at its line is enough for a regency."
 # DEBUG decisions (common/decisions/zz_persianate_debug_decisions.txt) — remove with them
 persianate_debug_begin_regency.title: "DEBUG: The Amirs Raise a Khan"
 persianate_debug_begin_regency.desc: "Testing aid. Starts the Amirs' Regency in Ulus Chaghatay at once, as if the khan had died with the begs over the bar."
 persianate_debug_begin_regency.a: "Begin the regency."
 persianate_debug_advance_regency.title: "DEBUG: Advance the Regency"
 persianate_debug_advance_regency.desc: "Testing aid. Adds 100 progress to the Amirs' Regency, enough for the next stage at the next monthly tick."
 persianate_debug_advance_regency.a: "Push it on."
 persianate_debug_take_regency.title: "DEBUG: Take the Khan"
 persianate_debug_take_regency.desc: "Testing aid. Your state becomes the regent of Ulus Chaghatay: the khan, the reform and the leadership pass to you."
 persianate_debug_take_regency.a: "The khan comes to my court."
 persianate_debug_sahib_qiran.title: "DEBUG: The Ṣāḥib-qirān's Hour"
 persianate_debug_sahib_qiran.desc: "Testing aid. Sets the regency to its fourth stage, gives the regent a wife of the line, and counts the legitimacy gap as filled for five years. The Ṣāḥib-qirān event reaches the regent at the next monthly tick. Needs a living khan in the regent's keeping."
 persianate_debug_sahib_qiran.a: "Lord of the Auspicious Conjunction."
 persianate_debug_bulqaq.title: "DEBUG: Bulqaq"
 persianate_debug_bulqaq.desc: "Testing aid. Empties the legitimacy gap and counts it as empty for three years. The Bulqaq event reaches the regent at the next monthly tick."
 persianate_debug_bulqaq.a: "Let it fall apart."
 persianate_debug_bar_met.title: "DEBUG: The Begs Outweigh the Throne (toggle)"
 persianate_debug_bar_met.desc: "Testing aid. Counts the regency bar as met, whatever the two readings say, until this is taken again. While it is on, any amir may use Rise Against the Khan, and a khan's death starts a regency. The panel's line under the standing changes with it."
 persianate_debug_bar_met.a: "Switch it."
 persianate_debug_cadet_flight.title: "DEBUG: The Chief Flees"
 persianate_debug_cadet_flight.desc: "Testing aid. Fires the event in which our chief may flee an invader and a kinsman submit in his place, without the war or the stage of the regency it normally needs. Choose who the invader is."
 persianate_debug_cadet_flight.a: "The invader is the state that leads the ulus."
 persianate_debug_cadet_flight.b: "The invader is a neighbour from outside the ulus."
 persianate_debug_cadet_coup.title: "DEBUG: The Cadet's Coup"
 persianate_debug_cadet_coup.desc: "Testing aid. Makes one kinsman of our house a far better soldier than the chief (+40 military) and fires the event in which he may seize the tümen."
 persianate_debug_cadet_coup.a: "Let him try."
 persianate_debug_cadet_needs_kinsman_tt: "An adult man of our ruler's own dynasty, not the ruler, is at our court"
 ULUS_KEEPING_LABEL: "In the keeping of"
 ULUS_REGENT_HEIR_LABEL: "Regent's heir"
 ULUS_KHAN_AGE_LABEL: "age"
