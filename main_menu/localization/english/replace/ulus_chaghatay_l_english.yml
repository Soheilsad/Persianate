l_english:
 # =====================================================================
 # Ulus Chaghatay — the organisation, its standing, the qubchur, the
 # four domains carved from the khan's share, and the panel.
 # IO:     in_game/common/international_organizations/ulus_chaghatay.txt
 # Panel:  in_game/gui/panels/organization/ulus_chaghatay.gui
 # Ledger: in_game/common/scripted_effects/14_ulus_chaghatay_effects.txt
 # =====================================================================

 # --- The organisation ---
 ulus_chaghatay: "Ulus Chaghatay"
 ulus_chaghatay_desc: "The people and pastures Chinggis Khān gave his second son, from the Altai to the Amu Darya. The khān holds court at Almaliq; under him the tümens hold their hereditary domains: the Barlas at Kesh, the Jalayir at Khujand, the Suldus at Balkh, the Qaraʾunas in the Afghan lands, the Dughlats at Kashgar. They are not provinces and they are not foreign kings. They ride when the khān rides, they do not make war on him or on one another, and they send him the qubchur.\n\nThe khān's seat is the organisation's leader. It need not stay where it is."
 ULUS_CHAGHATAY_KHAN: "Khān"
 ULUS_CHAGHATAY_KHAN_MALE: "Khān"
 ULUS_CHAGHATAY_KHAN_FEMALE: "Khātūn"
 io_opinion_ulus_chaghatay: "Of the same ulus"
 io_trust_ulus_chaghatay: "Of the same ulus"
 diplomatic_status_ulus_chaghatay_name: "Of Ulus Chaghatay"
 diplomatic_status_ulus_chaghatay_tooltip: "This realm belongs to the Chagatai ulus: the khān's own seat, or one of the amīr domains that answer it."
 ulus_chaghatay_list_who_tt: "The khān and the amīrs of Ulus Chaghatay:"

 # --- Junior standing (Members tab group) ---
 ulus_amir: "Amīr of the Ulus"
 ulus_amir_plural: "Amīrs of the Ulus"
 ulus_amir_desc: "The head of a tümen holding a hereditary domain inside the ulus. He answers the khān's summons to war, may not take the field against the khān or a fellow amīr, and sends the qubchur. His house keeps its own succession."
 MODIFIER_TYPE_NAME_ulus_amir_can_participate_in_parliament: "$ulus_amir$ in Parliament"
 MODIFIER_TYPE_DESC_ulus_amir_can_participate_in_parliament: "This allows the [ShowSpecialStatusName('ulus_amir')] to suggest [parliament_agendas|e] in the [parliament|e] of an [international_organization|e]."
 MODIFIER_TYPE_NAME_ulus_amir_agenda_impact: "Agenda Impact for $ulus_amir$"
 MODIFIER_TYPE_DESC_ulus_amir_agenda_impact: "This modifies the support that the [parliament_agendas|e] that the [ShowSpecialStatusName('ulus_amir')] group proposes has."

 # --- The qubchur ---
 ulus_chaghatay_qubchur: "Qubchur for the Khān"
 ulus_chaghatay_qubchur_desc: "The khān's share: one part in a hundred of each amīr's income, sent to the seat of the ulus. It is a light levy. What the khān truly has of his amīrs is their horsemen."
 ULUS_CHAGHATAY_QUBCHUR_PAYMENT_MULTIPLIER: "5% of the amīrs' [monthly_income_trade_and_tax|e]"
 ulus_chaghatay_qubchur_price: "Qubchur"
 MODIFIER_TYPE_NAME_ulus_chaghatay_qubchur_price_cost_modifier: "$ulus_chaghatay_qubchur_price$"
 MODIFIER_TYPE_DESC_ulus_chaghatay_qubchur_price_cost_modifier: "This impacts the [cost|e] of the qubchur the amīrs of [GetInternationalOrganization('ulus_chaghatay').GetName] send to the khān."

 # --- IO variables (header strip) ---
 ulus_amir_count: "Amīrs"
 ulus_amir_count_desc: "The junior members of the ulus: every member that is not the khān's seat."
 ulus_beg_power: "Weight of the Begs"
 ulus_beg_power_desc: "The power of the nobles' estate (the begs) in the khān's own realm. When the throne next falls vacant, the begs can raise a khān of their own if they hold at least half the power and at least twice the crown's."
 ulus_amir_ratio: "Great Amīrs to Khān"
 ulus_amir_ratio_desc: "The combined weight of the three greatest amīrs against the khān's own. A realm's weight is 40% its military strength, 30% its tax base, 20% its ruler's abilities and the rest its prestige; empty land counts for nothing. Near 1.00 the khān is their match; at the line shown on the panel they can raise a khān of their own."
 ULUS_COUNT_FORMAT: "$VAL|0$"
 ULUS_PERCENT_FORMAT: "$VAL|0$%"
 ULUS_RATIO_FORMAT: "$VAL|2$"

 # --- The four domains carved from the khan's share ---
 FGN: "Ulus of Fergana"
 FGN_ADJ: "Ferganan"
 CAC: "Ulus of Chach"
 CAC_ADJ: "Chachi"
 ISQ: "Ulus of Issyk-Kul"
 ISQ_ADJ: "Issyk-Kul"
 DZG: "Ulus of the Ili"
 DZG_ADJ: "Ili"

 # --- The beglerbeg's regency (government_reforms/08_ulus_chaghatay_reforms.txt) ---
 beglerbeg_regency: "Beglerbeg's Regency"
 beglerbeg_regency_desc: "The khān sits on the felt and the beg commands the ordu. Every yarligh goes out under the khān's seal and every tümen musters in his name, because it would not muster in the beg's: a man without the blood of Chinggis cannot be khān, so he keeps one. Qazaghan ruled the ulus this way through two khāns, and Mamai and Edigü ruled the house of Jochi so."

 # --- Panel: Overview cards (gui/panels/organization/ulus_chaghatay.gui) ---
 ULUS_KHAN_CARD: "The Khān"
 ULUS_KHAN_CARD_TT: "The seat of the ulus and the man who holds it. The heir is the one the seat's own law of succession names today; whether the amīrs let him sit is another matter."
 ULUS_HEIR_LABEL: "Heir:"
 ULUS_NO_HEIR: "No heir stands ready."
 ULUS_SUCCESSION_CARD: "The Succession"
 ULUS_BEG_BAR: "Power of the begs"
 ULUS_BEG_BAR_TT: "The begs are the nobles' estate of the khān's own realm: the estate the darugha seats feed. The rule has two parts, and both must hold when the throne falls vacant: the begs hold at least the share shown (half, or a third less after a child khān's reign), #Y and#! at least twice the crown's power. The second row shows the crown's power and what twice it comes to."
 ULUS_AMIR_BAR: "The three greatest amīrs against the khān"
 ULUS_AMIR_BAR_TT: "The three amīrs with the greatest weight, listed below, and their weights added together against the khān's own. If the throne falls vacant while the result is at or over the line, they raise a khān of their own. These are the three heaviest realms; the amīrs likeliest to take the khān are ranked separately, further down."
 ULUS_IF_KHAN_DIED: "Standing in the ulus"
 ULUS_KINGMAKER_TT: "The khān and the three amīrs best placed to take a khān into their keeping, ranked by #Y kingmaker score#!. The ranking is for reading: what decides a succession is the two bars above, and the line under the list says what they come to today. The score is: the realm's weight as a share of all the amīrs' weight × 400, plus the ruler's military skill × 0.5, plus his administrative skill × 0.2, plus his renown from battles and sieges won during a regency (to a limit of 60). An amīr adds 25 for a wife of the line of Chinggis; the khān adds 50 for being of the line himself."
 ULUS_NO_KINGMAKERS: "The roll is drawn up at the turn of each month."
 ULUS_AMIRS_CARD: "The Amīrs"
 ULUS_AMIRS_CARD_TT: "Every amīr of the ulus, heaviest first: his weight (out of 100 across the whole ulus, khān included) and his share of the amīrs' combined weight."
 ULUS_NO_AMIRS: "The khān has no amīrs."

 ULUS_CROWN_ROW: "Power of the crown"
 ULUS_KHAN_WEIGHT: "Weight of the khān"
 ULUS_KHAN_WEIGHT_TT: "The khān's own realm on the scale every member of the ulus is weighed on. Each member's [military_strength|e], tax base, ruler's abilities and prestige are taken as its share of the whole ulus's total, khān included: the host counts for 40, the tax base for 30, the ruler for 20 and prestige for 10. All members' weights together make 100. On top of that come the tümens pledged to a house, a share of its friends outside the ulus, and for a time whatever largesse has bought."
 ULUS_WEIGHT_MIL: "strength"
 ULUS_WEIGHT_TAX: "tax"
 ULUS_WEIGHT_PRE: "prestige"
 ULUS_WEIGHT_RUL: "ruler"
 ULUS_GREATEST_AMIR_TT: "One of the three heaviest amīr realms, with its weight (out of 100 across the whole ulus). The three weights are summed for the bar above."
 ULUS_AGAINST: "against"
 ULUS_SCORE_HEADER: "weight"
 ULUS_SEAT_ROW_TT: "The khān's own seat, scored as his amīrs are."
 ULUS_HEIR_HOLDS: "If the khān died today, his heir would succeed."
 ULUS_AMIRS_WOULD_RISE: "If the khān died today, the amīrs would raise a khān of their own."
 ULUS_OUTCOME_TT: "Decided by the two bars above, not by the ranking: the begs' power in the khān's own realm, and the three greatest amīrs against the khān. Either one at its line is enough for a regency."
 # DEBUG decisions (common/decisions/zz_persianate_debug_decisions.txt) — remove with them
 persianate_debug_begin_regency.title: "DEBUG: The Amīrs Raise a Khān"
 persianate_debug_begin_regency.desc: "Testing aid. Starts the Amīrs' Regency in Ulus Chaghatay at once, as if the khān had died with the begs over the bar."
 persianate_debug_begin_regency.a: "Begin the regency."
 persianate_debug_advance_regency.title: "DEBUG: Advance the Regency"
 persianate_debug_advance_regency.desc: "Testing aid. Adds 100 progress to the Amīrs' Regency, enough for the next stage at the next monthly tick."
 persianate_debug_advance_regency.a: "Push it on."
 persianate_debug_take_regency.title: "DEBUG: Take the Khān"
 persianate_debug_take_regency.desc: "Testing aid. Your state becomes the regent of Ulus Chaghatay: the khān, the reform and the leadership pass to you."
 persianate_debug_take_regency.a: "The khān comes to my court."
 persianate_debug_sahib_qiran.title: "DEBUG: The Sāhib-qirān's Hour"
 persianate_debug_sahib_qiran.desc: "Testing aid. Sets the regency to its fourth stage, gives the regent a wife of the line, and counts the legitimacy gap as filled for five years. The Sāhib-qirān event reaches the regent at the next monthly tick. Needs a living khān in the regent's keeping."
 persianate_debug_sahib_qiran.a: "Lord of the Auspicious Conjunction."
 persianate_debug_bulqaq.title: "DEBUG: Bulqaq"
 persianate_debug_bulqaq.desc: "Testing aid. Empties the legitimacy gap and counts it as empty for three years. The Bulqaq event reaches the regent at the next monthly tick."
 persianate_debug_bulqaq.a: "Let it fall apart."
 persianate_debug_bar_met.title: "DEBUG: The Begs Outweigh the Throne (toggle)"
 persianate_debug_bar_met.desc: "Testing aid. Counts the regency bar as met, whatever the two readings say, until this is taken again. While it is on, any amīr may use Rise Against the Khān, and a khān's death starts a regency. The panel's line under the standing changes with it."
 persianate_debug_bar_met.a: "Switch it."
 persianate_debug_cadet_flight.title: "DEBUG: The Chief Flees"
 persianate_debug_cadet_flight.desc: "Testing aid. Fires the event in which our chief may flee an invader and a kinsman submit in his place, without the war or the stage of the regency it normally needs. Choose who the invader is."
 persianate_debug_cadet_flight.a: "The invader is the state that leads the ulus."
 persianate_debug_cadet_flight.b: "The invader is a neighbour from outside the ulus."
 persianate_debug_cadet_coup.title: "DEBUG: The Cadet's Coup"
 persianate_debug_cadet_coup.desc: "Testing aid. Makes one kinsman of our house a far better soldier than the chief (+40 military) and fires the event in which he may seize the tümen."
 persianate_debug_cadet_coup.a: "Let him try."
 persianate_debug_cadet_needs_kinsman_tt: "An adult man of our ruler's own dynasty, not the ruler, is at our court"
 ULUS_KEEPING_LABEL: "In the keeping of"
 ULUS_REGENT_HEIR_LABEL: "Regent's heir:"
 ULUS_KHAN_AGE_LABEL: "age"
 ULUS_PLEDGES_CARD: "Pledges"
 ULUS_PLEDGES_CARD_TT: "Every house that has pledged its tümen, and to whom: its whole weight is counted as that house's (or the khān's), and it is out of the reckoning for the khān itself. A pledge has no term. It stands until it is taken back, until the house it was given to leaves the ulus or takes the seat, or until a rising that house leads is broken. Houses with a patron outside the ulus are listed too."
 ULUS_NO_PLEDGES: "No tümen is pledged."
 ULUS_PLEDGED_TO: "pledged to"
 ULUS_PLEDGED_TO_KHAN: "pledged to the khān"
 ULUS_PATRON_ROW: "patron: [Country.MakeScope.GetVariable('ulus_outside_backer').GetCountry.GetName]"
 ULUS_WEIGHT_BREAKDOWN: "#T [Country.GetName]: weight [Country.MakeScope.GetVariable('ulus_weight_eff').GetValue|1]#!\nHost: [Country.MakeScope.GetVariable('ulus_p_mil').GetValue|1] of 40\nTax base: [Country.MakeScope.GetVariable('ulus_p_tax').GetValue|1] of 30\nRuler's abilities: [Country.MakeScope.GetVariable('ulus_p_rul').GetValue|1] of 20\nPrestige: [Country.MakeScope.GetVariable('ulus_p_pre').GetValue|1] of 10\nTümens and subjects behind it: +[Country.MakeScope.GetVariable('ulus_p_back').GetValue|1]\nFriends outside the ulus: +[Country.MakeScope.GetVariable('ulus_p_out').GetValue|1]\nPassing gains (largesse, a raid won): +[Country.MakeScope.GetVariable('ulus_p_boost').GetValue|1]\nIts own weight given to another house: −[Country.MakeScope.GetVariable('ulus_p_lent').GetValue|1]\n#italic Each part is this house's share of the whole ulus. An outside friend counts for a quarter of his weight (a backer 15%), reckoned at no more than 15 each, and all of them together for no more than 10.#!"
 ULUS_SCORE_BREAKDOWN: "#T [Country.GetName]: kingmaker score [Country.MakeScope.GetVariable('ulus_kingmaker_score').GetValue|0]#!\nShare of the amīrs' weight × 400: [Country.MakeScope.GetVariable('ulus_s_share').GetValue|0]\nRuler's military skill × 0.5: [Country.MakeScope.GetVariable('ulus_s_mil').GetValue|0]\nRuler's administrative skill × 0.2: [Country.MakeScope.GetVariable('ulus_s_adm').GetValue|0]\nA wife of Chinggis's line: [Country.MakeScope.GetVariable('ulus_s_wife').GetValue|0]\nA patron of the line outside the ulus: [Country.MakeScope.GetVariable('ulus_s_patron').GetValue|0]\nRenown: [Country.MakeScope.GetVariable('ulus_s_renown').GetValue|0]\nOf the line himself (the khān's seat only): [Country.MakeScope.GetVariable('ulus_s_line').GetValue|0]"
 ULUS_STANDING_ROW_TT: "$ULUS_SCORE_BREAKDOWN$\n\n$ULUS_WEIGHT_BREAKDOWN$"
 ULUS_GREATEST_ROW_TT: "$ULUS_WEIGHT_BREAKDOWN$"
 ULUS_AMIR_ROW_TT: "$ULUS_WEIGHT_BREAKDOWN$\n\n$ULUS_SCORE_BREAKDOWN$"
 ULUS_KEEPER_WEIGHT: "Weight of the keeper of the khān"
 ULUS_ROW_LENT_WEIGHT: "([Country.MakeScope.GetVariable('ulus_weight').GetValue|1])"
