l_english:
 # =====================================================================
 # Ulus Chaghatay — the organisation, its standing, the qubchur, the
 # four domains carved from the khan's share, and the panel.
 # IO:     in_game/common/international_organizations/ulus_chaghatay.txt
 # Panel:  in_game/gui/panels/organization/ulus_chaghatay.gui
 # Ledger: in_game/common/scripted_effects/14_ulus_chaghatay_effects.txt
 # =====================================================================

 # --- The organisation ---
 ulus_chaghatay: "Ulus Chaghatay"
 ulus_chaghatay_desc: "The people and pastures Chinggis Khan gave his second son, from the Altai to the Amu Darya. The khan holds court at Almaliq; under him the tümens hold their hereditary domains: the Barlas at Kesh, the Jalayir at Khujand, the Suldus at Balkh, the Qara'unas in the Afghan lands, the Dughlats at Kashgar. They are not provinces and they are not foreign kings. They ride when the khan rides, they do not make war on him or on one another, and they send him the qubchur.\n\nThe khan's seat is the organisation's leader. It need not stay where it is."
 ULUS_CHAGHATAY_KHAN: "Khan"
 ULUS_CHAGHATAY_KHAN_MALE: "Khan"
 ULUS_CHAGHATAY_KHAN_FEMALE: "Khatun"
 io_opinion_ulus_chaghatay: "Of the same ulus"
 io_trust_ulus_chaghatay: "Of the same ulus"
 diplomatic_status_ulus_chaghatay_name: "Of Ulus Chaghatay"
 diplomatic_status_ulus_chaghatay_tooltip: "This realm belongs to the Chagatai ulus: the khan's own seat, or one of the amir domains that answer it."
 ulus_chaghatay_list_who_tt: "The khan and the amirs of Ulus Chaghatay:"

 # --- Junior standing (Members tab group) ---
 ulus_amir: "Amir of the Ulus"
 ulus_amir_plural: "Amirs of the Ulus"
 ulus_amir_desc: "The head of a tümen holding a hereditary domain inside the ulus. He answers the khan's summons to war, may not take the field against the khan or a fellow amir, and sends the qubchur. His house keeps its own succession."
 MODIFIER_TYPE_NAME_ulus_amir_can_participate_in_parliament: "$ulus_amir$ in Parliament"
 MODIFIER_TYPE_DESC_ulus_amir_can_participate_in_parliament: "This allows the [ShowSpecialStatusName('ulus_amir')] to suggest [parliament_agendas|e] in the [parliament|e] of an [international_organization|e]."
 MODIFIER_TYPE_NAME_ulus_amir_agenda_impact: "Agenda Impact for $ulus_amir$"
 MODIFIER_TYPE_DESC_ulus_amir_agenda_impact: "This modifies the support that the [parliament_agendas|e] that the [ShowSpecialStatusName('ulus_amir')] group proposes has."

 # --- The qubchur ---
 ulus_chaghatay_qubchur: "Qubchur for the Khan"
 ulus_chaghatay_qubchur_desc: "The khan's share: one part in a hundred of each amir's income, sent to the seat of the ulus. It is a light levy. What the khan truly has of his amirs is their horsemen."
 ULUS_CHAGHATAY_QUBCHUR_PAYMENT_MULTIPLIER: "1% of the amirs' [monthly_income_trade_and_tax|e]"
 ulus_chaghatay_qubchur_price: "Qubchur"

 # --- IO variables (header strip) ---
 ulus_amir_count: "Amirs"
 ulus_amir_count_desc: "The junior members of the ulus: every member that is not the khan's seat."
 ulus_beg_power: "Weight of the Begs"
 ulus_beg_power_desc: "The power of the nobles in the khan's own realm. At 50% the begs can raise a khan of their own when the throne next falls vacant."
 ulus_amir_ratio: "Amirs to Khan"
 ulus_amir_ratio_desc: "The combined weight of the amirs against the khan's own. A realm's weight is half its military strength, a third its tax base and the rest its prestige, each as a share of the whole ulus; empty land counts for nothing. At 2.00 the amirs together outweigh the khan twice over."
 ULUS_COUNT_FORMAT: "$VAL|0$"
 ULUS_PERCENT_FORMAT: "$VAL|0$%"
 ULUS_RATIO_FORMAT: "$VAL|2$"

 # --- The four domains carved from the khan's share ---
 FGN: "Ulus of Fergana"
 FGN_ADJ: "Ferganan"
 CAC: "Ulus of Chach"
 CAC_ADJ: "Chachi"
 ISQ: "Ulus of Issyk-Kul"
 ISQ_ADJ: "Issyk-Kul"
 DZG: "Ulus of Dzungaria"
 DZG_ADJ: "Dzungarian"

 # --- The beglerbeg's regency (government_reforms/08_ulus_chaghatay_reforms.txt) ---
 beglerbeg_regency: "Beglerbeg's Regency"
 beglerbeg_regency_desc: "The khan sits on the felt and the beg commands the ordu. Every yarlıq goes out under the khan's seal and every tümen musters in his name, because it would not muster in the beg's: a man without the blood of Chinggis cannot be khan, so he keeps one. Qazaghan ruled the ulus this way through two khans, and Mamai and Edigü ruled the house of Jochi so."

 # --- Panel: Overview cards (gui/panels/organization/ulus_chaghatay.gui) ---
 ULUS_KHAN_CARD: "The Khan"
 ULUS_KHAN_CARD_TT: "The seat of the ulus and the man who holds it. The heir is the one the seat's own law of succession names today; whether the amirs let him sit is another matter."
 ULUS_HEIR_LABEL: "Heir:"
 ULUS_NO_HEIR: "No heir stands ready."
 ULUS_SUCCESSION_CARD: "The Succession"
 ULUS_BEG_BAR: "Weight of the begs"
 ULUS_BEG_BAR_TT: "The power of the nobles in the khan's own realm, against the half that lets them make a khan. If the throne falls vacant with the begs at 50% or more, they do not wait for the heir."
 ULUS_AMIR_BAR: "Amirs against the khan"
 ULUS_AMIR_BAR_TT: "The combined [military_strength|e] of the amirs as a multiple of the khan's own. If the throne falls vacant while the amirs field twice the khan's strength, they raise a khan of their own."
 ULUS_IF_KHAN_DIED: "If the khan died today"
 ULUS_KINGMAKER_TT: "The amirs best placed to take a khan into their keeping and rule the ulus in his name. An amir's standing is twice his military skill, plus his administrative skill, plus two for each location of his domain (to a limit of 60), plus 25 if he has a wife of the line of Chinggis."
 ULUS_NO_KINGMAKERS: "No amir stands ready. The roll is drawn up at the turn of each month."
 ULUS_AMIRS_CARD: "The Amirs"
 ULUS_AMIRS_CARD_TT: "Every amir of the ulus, strongest first, with his share of the amirs' combined [military_strength|e]."
 ULUS_NO_AMIRS: "The khan has no amirs."
